<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>IronTrack - 智能健身伴侣</title>
<link rel="manifest" href="data:application/json,{}">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a2e;--card:#2d2d44;--border:#3d3d54;--accent:#ff6b35;
  --accent-light:#ff8c42;--text:#e8e8e8;--muted:#888
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{max-width:430px;margin:0 auto;min-height:100vh;padding:16px 16px 100px;position:relative}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* 页面容器 */
.page{display:none;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* 底部导航 */
#bottomNav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(29,29,44,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0)}
#bottomNav .nav-inner{display:flex;align-items:center;justify-content:space-around;height:64px;max-width:430px;margin:0 auto}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 12px;cursor:pointer;border:none;background:none;color:var(--muted);font-size:11px;transition:color .2s;position:relative}
.nav-item.active{color:var(--accent);font-weight:600}
.nav-item svg{width:22px;height:22px}
.nav-item.primary{margin-top:-24px}
.nav-item.primary .nav-btn-circle{width:52px;height:52px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(255,107,53,.3);transition:transform .2s}
.nav-item.primary:hover .nav-btn-circle{transform:scale(1.08)}
.nav-item.primary svg{width:26px;height:26px}

/* 通用组件 */
.card{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:16px;margin-bottom:12px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;border:none;font-size:16px;font-weight:700;cursor:pointer;text-align:center;transition:opacity .2s;text-decoration:none}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 0 0 0 rgba(255,107,53,.4);animation:pulse 2s infinite}
.btn-accent:hover{opacity:.9}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,.4)}50%{box-shadow:0 0 0 12px rgba(255,107,53,0)}}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;background:var(--bg);font-size:11px;color:var(--muted);border:1px solid var(--border)}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;background:var(--bg);font-size:11px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-item{background:var(--card);border-radius:12px;padding:12px;text-align:center;border:1px solid var(--border)}
.stat-value{color:var(--accent);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-label{color:var(--muted);font-size:11px;margin-top:2px}
.section-title{font-size:15px;font-weight:700;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between}
.flex-gap{display:flex;gap:8px;flex-wrap:wrap}
.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.text-accent{color:var(--accent)}.text-muted{color:var(--muted)}.text-sm{font-size:13px}.text-xs{font-size:11px}
.font-bold{font-weight:700}.text-center{text-align:center}

/* 首页 */
.greeting{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.greeting h1{font-size:22px;font-weight:700}
.avatar{width:40px;height:40px;border-radius:50%;background:rgba(255,107,53,.15);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:14px;font-weight:700}
.today-card{position:relative}
.today-card .card-header{display:flex;justify-content:space-between;margin-bottom:10px}
.exercise-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

/* 计划页 */
.day-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.day-tab{flex-shrink:0;padding:8px 16px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);white-space:nowrap;transition:all .2s}
.day-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.exercise-list>div{padding:12px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.exercise-list>div:last-child{border-bottom:none}
.ex-number{color:var(--accent);font-weight:700;font-size:14px;width:20px;flex-shrink:0}
.ex-info{flex:1;min-width:0}
.ex-name{font-weight:600;font-size:14px}
.ex-target{color:var(--muted);font-size:12px}
.ex-prev{color:var(--muted);font-size:11px;text-align:right;flex-shrink:0}

/* 训练页 - 全屏聚焦 */
.training-container{display:flex;flex-direction:column;min-height:calc(100vh - 200px);justify-content:center}
.training-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.exercise-name{font-size:24px;font-weight:700;text-align:center;margin-bottom:4px}
.exercise-target{color:var(--muted);font-size:13px;text-align:center;margin-bottom:32px}
.num-control{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:24px}
.num-btn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s;user-select:none}
.num-btn:hover{border-color:var(--accent)}
.num-display{text-align:center}
.num-display .big{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
.num-display .unit{font-size:14px;color:var(--muted)}
.num-display .small{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.set-indicator{color:var(--muted);font-size:13px;text-align:center;margin-bottom:16px}
.set-history{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
.set-dot{padding:5px 12px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:12px;color:var(--muted)}

/* 休息倒计时 */
.rest-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 200px);text-align:center}
.rest-circle{width:120px;height:120px;border-radius:50%;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.rest-time{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.rest-label{color:var(--muted);font-size:14px;margin-bottom:8px}
.rest-next{color:var(--muted);font-size:13px;margin-bottom:24px}
.skip-btn{padding:8px 20px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;cursor:pointer}

/* 完成页 */
.complete-container{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:calc(100vh - 200px);justify-content:center}
.complete-icon{font-size:60px;margin-bottom:16px}
.complete-title{font-size:24px;font-weight:700;margin-bottom:4px}
.complete-time{color:var(--muted);font-size:14px;margin-bottom:20px}
.summary-card{width:100%;text-align:left;margin-bottom:20px}

/* 数据页 */
.tab-bar{display:flex;background:var(--card);border-radius:12px;padding:3px;border:1px solid var(--border)}
.tab-btn{flex:1;padding:8px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.tab-btn.active{background:var(--accent);color:#fff}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:20px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:4px 4px 0 0;position:relative;overflow:hidden;min-height:4px}
.bar-inner{position:absolute;bottom:0;left:0;right:0;border-radius:4px 4px 0 0;background:var(--accent);opacity:.3}
.bar-inner.fill{opacity:.8;height:70%}
.bar-value{font-size:10px;color:var(--muted)}
.bar-label{font-size:10px;color:var(--muted)}
.progress-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:4px;transition:width .5s}
.stat-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat-item-2{background:var(--bg);border-radius:10px;padding:12px}
.stat-item-2 .val{color:var(--accent);font-size:18px;font-weight:700}
.stat-item-2 .lbl{color:var(--muted);font-size:11px}

/* 档案页 */
.field-group{margin-bottom:14px}
.field-label{color:var(--muted);font-size:11px;margin-bottom:4px;display:block}
.field-value{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.knowledge-item{display:flex;align-items:flex-start;gap:12px;padding:14px;cursor:pointer;transition:border-color .2s}
.knowledge-item:hover{border-color:rgba(255,107,53,.3)}
.knowledge-icon{font-size:24px;flex-shrink:0}

/* 响应式 */
@media(min-width:768px){.page{padding:0 20px}}
</style>
</head>
<body>
<div id="app">
  <!-- 首页 -->
  <div id="page-home" class="page active">
    <div id="homeContent"></div>
  </div>

  <!-- 计划页 -->

      </div>

  </div>

  <!-- 我的页 -->
  <div id="page-profile" class="page">

    <div class="tab-bar mb-4">
      <button class="tab-btn active" onclick="switchProfileTab('profile',this)">个人档案</button>
      <button class="tab-btn" onclick="switchProfileTab('knowledge',this)">知识库</button>
    </div>
    <div id="profileContent"></div>
  </div>
</div>

    catch(e) { return fallback; }
  },
  set(key, val) {
    try { localStorage.setItem('irontrack_'+key, JSON.stringify(val)); }

  }
};

// 根据上次训练记录更新 prevW/prevR
function applyPrevRecords() {
  plan.days.forEach(day => {
    day.exercises.forEach(ex => {
      const lastSession = [...sessions].reverse().find(s => s.dayName === day.name);
      if (lastSession) {
        const lastEx = lastSession.exercises.find(e => e.name === ex.name);
        if (lastEx && lastEx.sets.length > 0) {
          const lastSet = lastEx.sets[lastEx.sets.length - 1];
          ex.prevW = lastSet.w;
          ex.prevR = lastSet.r;
        }
      }
    });
  });
}

function formatDate(d) {
  return (d.getMonth()+1)+'/'+d.getDate();
}

function getTodayStr() {
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');
}

function getWeekStart() {
  const d = new Date();
  d.setDate(d.getDate() - d.getDay() + 1);
  return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');
}

function getWeekSessions() {
  const ws = getWeekStart();
  return sessions.filter(s => s.date >= ws);
}

function getStreak() {
  let streak = 0;
  const sorted = [...sessions].sort((a,b) => b.date.localeCompare(a.date));
  const seen = new Set();
  for (const s of sorted) {
    if (!seen.has(s.date)) {
      seen.add(s.date);
      if (streak === 0) streak = 1;
      else streak++;
    }
  }
  return streak;
}

async function aiAdjustDay() {
  if (!profile.apiKey) { alert('请先在「我的」页面设置 DeepSeek API Key'); return; }
  const day = plan.days[selectedDayIdx];
  const recentForDay = sessions.filter(s => s.dayName === day.name).slice(0, 3);
  const recentStr = recentForDay.map(s => {
    return s.exercises.map(e => {
      const maxW = Math.max(...e.sets.map(st => st.w));
      return `${e.name}(${maxW}kg)`;
    }).join(', ');
  }).join('\n');

  const prompt = `你是专业健身教练。请根据以下信息优化【${day.name}】这一天的训练内容：

【当前训练日】
${day.name} - ${day.focus}
${day.exercises.map(e => `${e.name}: ${e.sets}组×${e.reps}次, ${e.weight}kg, 休息${e.rest}s`).join('\n')}

【该训练日最近记录】
${recentStr || '无记录'}

【用户档案】
体重: ${profile.weight}kg, 体脂: ${profile.bodyFat}%, 目标: ${profile.goal}, 经验: ${profile.experience}

【输出要求】只输出 JSON：
{
  "name": "${day.name}",
  "focus": "训练部位",
  "exercises": [
    {"name": "动作", "sets": 组数, "reps": 次数, "weight": 建议重量, "rest": 休息秒}
  ]
}
要求：动作数量 5-7 个，复合动作优先，重量基于上次记录递增，只输出 JSON`;

  const result = await aiCall(prompt);
  if (!result) return;
  try {
    const jsonStr = result.replace(/```json\s*|\s*```/g, '').trim();
    const newDay = JSON.parse(jsonStr);
    if (!newDay.exercises || !Array.isArray(newDay.exercises)) throw new Error('格式错误');
    // 更新当前这一天
    plan.days[selectedDayIdx] = {
      ...plan.days[selectedDayIdx],
      name: newDay.name || day.name,
      focus: newDay.focus || day.focus,
      exercises: newDay.exercises.map((ex, i) => ({
        id: 'adj-' + selectedDayIdx + '-' + i,
        name: ex.name, sets: ex.sets, reps: ex.reps,
        weight: ex.weight || 0, rest: ex.rest || 90,
        sortOrder: i
      }))
    };
    LS.set('plan', plan);
    applyPrevRecords();
    renderPlanPage();
  } catch(e) {
    alert('AI 返回格式解析失败: ' + e.message);
  }
}

let trainState = {

function resetTraining() {
  trainState = {
    day: plan.days[0], exIdx: 0, set: 1, weight: plan.days[0].exercises[0].weight,
    reps: plan.days[0].exercises[0].reps, records: {}, isResting: false,
    restTimer: 0, sessionTime: 0, complete: false,
    timerInterval: null, restInterval: null
  };
  startSessionTimer();
}

function startSessionTimer() {
  if (trainState.timerInterval) clearInterval(trainState.timerInterval);
  trainState.timerInterval = setInterval(() => {
    if (!trainState.complete && !trainState.isResting) trainState.sessionTime++;
  }, 1000);
}

function startRestTimer() {
  const ex = trainState.day.exercises[trainState.exIdx];
  trainState.restTimer = ex.rest;
  trainState.isResting = true;
  if (trainState.restInterval) clearInterval(trainState.restInterval);
  trainState.restInterval = setInterval(() => {
    if (trainState.restTimer > 0) {
      trainState.restTimer--;
    } else {
      clearInterval(trainState.restInterval);
      trainState.isResting = false;
      renderTrainingPage();
    }
    if (trainState.isResting) renderRestOverlay();
  }, 1000);
  renderRestOverlay();
}

function renderTrainingPage() {
  const s = trainState;
  if (s.complete) { renderComplete(); return; }
  if (s.isResting) { renderRestOverlay(); return; }
  renderTrainingUI();
}

function renderTrainingUI() {

function renderComplete() {
  const s = trainState;

    const recs = s.records[ex.id] || [];
    const vol = recs.reduce((sum,r) => sum + r.w*r.r, 0);
    return vol > 0 ? `<div class="row text-sm"><span>${ex.name}</span><span class="text-accent">${vol}kg 总容量</span></div>` : '';
  }).filter(Boolean).join('');

      <button class="btn btn-outline mt-3" onclick="navigate('home')">返回首页</button>
    </div>
  `;
}

function adjustWeight(delta) {
  trainState.weight = Math.max(0, trainState.weight + delta);
  renderTrainingUI();
}

function adjustReps(delta) {
  trainState.reps = Math.max(0, trainState.reps + delta);
  renderTrainingUI();
}

function completeSet() {
  const s = trainState;
  const ex = s.day.exercises[s.exIdx];
  if (!s.records[ex.id]) s.records[ex.id] = [];
  s.records[ex.id].push({set:s.set, w:s.weight, r:s.reps});
  if (s.set < ex.sets) {
    s.set++;
    startRestTimer();
  } else if (s.exIdx < s.day.exercises.length - 1) {
    s.exIdx++;
    s.set = 1;
    const next = s.day.exercises[s.exIdx];
    s.weight = next.weight;
    s.reps = next.reps;
    s.restTimer = 90;
    s.isResting = true;
    startRestTimer();
  } else {
    s.complete = true;
    if (s.timerInterval) clearInterval(s.timerInterval);
    // 保存训练记录到 localStorage
    saveSession();
    // 当天体重记录
    const todayDate = formatDate(new Date());
    if (!bodyRecords.find(r => r.date === todayDate)) {
      bodyRecords.push({ date: todayDate, weight: profile.weight, bodyFat: profile.bodyFat });
      if (bodyRecords.length > 30) bodyRecords.shift();
      LS.set('body_records', bodyRecords);
    }
    renderComplete();
  }
}

function saveSession() {
  const s = trainState;
  const session = {
    date: getTodayStr(),
    dayName: s.day.name,
    focusArea: s.day.focus,
    duration: s.sessionTime,
    exercises: s.day.exercises.map(ex => {
      const recs = s.records[ex.id] || [];
      return { name: ex.name, sets: recs.map(r => ({ w: r.w, r: r.r })) };
    }).filter(e => e.sets.length > 0)
  };
  sessions.unshift(session);
  if (sessions.length > 200) sessions.length = 200;
  LS.set('sessions', sessions);
  todayIndex = (todayIndex + 1) % plan.days.length;
  LS.set('today_index', todayIndex);
  applyPrevRecords();
}

function skipRest() {
  if (trainState.restInterval) clearInterval(trainState.restInterval);
  trainState.isResting = false;
  trainState.restTimer = 0;
  renderTrainingPage();
}

function formatTime(s) {
  return Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');
}

function resetTraining() {
  const day = plan.days[todayIndex];
  trainState = {
    day: day, exIdx: 0, set: 1, weight: day.exercises[0].weight,
    reps: day.exercises[0].reps, records: {}, isResting: false,
    restTimer: 0, sessionTime: 0, complete: false,
    timerInterval: null, restInterval: null
  };
  startSessionTimer();
}

function renderDataChart(tab) {
  const container = document.getElementById('dataChart');
  if (tab === 'weight') {
    if (bodyRecords.length === 0) {
      container.innerHTML = '<div class="text-center text-muted text-sm" style="padding:40px">暂无体重记录<br>完成训练后自动记录</div>';
      return;
    }
    const max = Math.max(...bodyRecords.map(r=>r.weight));
    const min = Math.min(...bodyRecords.map(r=>r.weight));
    const range = (max - min) || 1;
    const display = bodyRecords.slice(-7);
    container.innerHTML = `
      <div class="row mb-3"><div class="font-bold text-sm">体重变化</div><span class="text-muted text-xs">最近${display.length}次</span></div>
      <div class="bar-chart">
        ${display.map(r => {
          const h = ((r.weight-min)/range)*100+20;
          return `<div class="bar-col"><span class="bar-value">${r.weight}</span><div class="bar" style="height:${h}%"><div class="bar-inner fill"></div></div><span class="bar-label">${r.date}</span></div>`;
        }).join('')}
      </div>`;
    if (display.length > 1) {
      const first = display[0].weight;
      const last = display[display.length-1].weight;
      const diff = (last - first).toFixed(1);
      const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
      container.innerHTML += `
      <div class="row mt-3 text-xs text-muted">
        <span>起始 ${first}kg</span>
        <span class="${diff<0?'text-accent':diff>0?'':'text-muted'}" style="color:${diff>0?'#f4a261':'var(--accent)'}">${arrow} ${Math.abs(diff)}kg</span>
        <span>当前 ${last}kg</span>
      </div>`;
    }
  } else {
    // 力量增长 - 从训练记录中提取
    const allEx = {};
    sessions.forEach(s => {
      s.exercises.forEach(ex => {
        if (ex.sets.length > 0) {
          const maxW = Math.max(...ex.sets.map(st => st.w));
          if (!allEx[ex.name]) allEx[ex.name] = [];
          allEx[ex.name].push({ date: s.date, weight: maxW });
        }
      });
    });
    const topEx = Object.entries(allEx)
      .filter(([,v]) => v.length >= 2)
      .slice(0, 4);
    if (topEx.length === 0) {
      container.innerHTML = '<div class="text-center text-muted text-sm" style="padding:40px">完成2次以上训练后<br>可查看力量增长曲线</div>';
      return;
    }
    const colors = ['var(--accent)','#f4a261','#2a9d8f','#e76f51'];
    container.innerHTML = `
      <div class="row mb-4"><div class="font-bold text-sm">力量增长曲线</div><div class="flex-gap text-xs">${topEx.map(([n],i)=>`<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${colors[i]};vertical-align:middle;margin-right:3px"></span>${n}</span>`).join('')}</div></div>
      ${topEx.map(([name, records], i) => {
        const first = records[0].weight;
        const last = records[records.length-1].weight;
        const pct = Math.min(100, Math.max(0, Math.round(((last - first) / Math.max(first, 1)) * 100)));
        return `<div style="margin-bottom:14px"><div class="row text-xs text-muted mb-1"><span>${name}</span><span style="color:${colors[i]}">${first} → ${last}kg ${last>=first?'+':''}${(last-first).toFixed(1)}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct>0?30+pct*0.7:10}%;background:${colors[i]}"></div></div></div>`;
      }).join('')}
      <div class="text-center text-xs text-muted mt-4">共 ${sessions.length} 次训练记录</div>`;
  }
  // 更新底部统计
  updateWeekStats();
}

function updateWeekStats() {
  const ws = getWeekSessions();
  const totalSets = ws.reduce((s, sess) => s + sess.exercises.reduce((es, ex) => es + ex.sets.length, 0), 0);
  const totalVol = ws.reduce((s, sess) => s + sess.exercises.reduce((es, ex) => es + ex.sets.reduce((ss, st) => ss + st.w*st.r, 0), 0), 0);
  const totalTime = ws.reduce((s, sess) => s + (sess.duration||0), 0);
  const statsEl = document.getElementById('weekStats');
  if (statsEl) {
    statsEl.innerHTML = `
      <div class="stat-item-2"><div class="val">${ws.length}</div><div class="lbl">完成训练</div></div>
      <div class="stat-item-2"><div class="val">${totalSets}</div><div class="lbl">总组数</div></div>
      <div class="stat-item-2"><div class="val">${totalVol.toLocaleString()}</div><div class="lbl">总容量 kg</div></div>
      <div class="stat-item-2"><div class="val">${(totalTime/3600).toFixed(1)}h</div><div class="lbl">总时长</div></div>`;
  }
}

function saveProfile() {
  profile.height = parseFloat(document.getElementById('pf-height').value) || profile.height;
  profile.weight = parseFloat(document.getElementById('pf-weight').value) || profile.weight;

async function testApiKey() {
  const key = document.getElementById('pf-apiKey').value.trim();
  if (!key) { document.getElementById('apiTestMsg').innerHTML = '<span style="color:#f4a261">请输入 API Key</span>'; return; }
  document.getElementById('apiTestMsg').innerHTML = '<span style="color:var(--muted)">测试中...</span>';
  try {
    const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },

      document.getElementById('apiTestMsg').innerHTML = '<span style="color:#2a9d8f">连接成功</span>';

// ============ AI 调用 ============
async function aiCall(prompt) {
  const key = profile.apiKey;
  if (!key) { alert('请先在「我的」页面设置 DeepSeek API Key'); return null; }
  try {
    const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'user', content: prompt }], temperature: 0.7, max_tokens: 4000 })
    });
    if (!res.ok) { const err = await res.json().catch(() => ({})); alert('AI 调用失败: ' + (err.error?.message || res.status)); return null; }
    const data = await res.json();
    return data.choices[0].message.content;
  } catch(e) { alert('网络错误: ' + e.message); return null; }
}

function buildAiPrompt() {
  const recent = sessions.slice(0, 6).map(s => {
    const exSummary = s.exercises.map(e => {
      const maxW = Math.max(...e.sets.map(st => st.w));
      return `${e.name}(${maxW}kg)`;
    }).join('、');
    return `${s.date} ${s.dayName}: ${exSummary}`;
  }).join('\n');

  return `你是一个专业的健身教练，专门为增肌训练者设计训练计划。请根据以下信息生成训练计划：

【用户档案】
- 身高: ${profile.height}cm, 体重: ${profile.weight}kg, 体脂率: ${profile.bodyFat}%
- 训练经验: ${profile.experience}, 目标: ${profile.goal}
- 每周训练天数: ${profile.trainingDays}天
- 可用器械: ${profile.equipment.join('、')}
- 当前分化方式: ${plan.name}

【最近训练记录】
${recent || '尚无训练记录'}

【输出要求】
请生成一个调整后的训练计划，输出严格按以下 JSON 格式（不要包含任何其他文字）：

{
  "name": "计划名称",
  "cycle": "循环说明",
  "days": [
    {
      "name": "训练日名称",
      "focus": "训练部位",
      "exercises": [
        {"name": "动作名称", "sets": 组数, "reps": 次数, "weight": 建议重量kg, "rest": 休息秒数}
      ]
    }
  ]
}

要求：
1. 计划天数与用户每周训练天数匹配
2. 每组动作数量控制在 5-7 个
3. 复合动作(深蹲/卧推/硬拉/推举/划船)优先排在前面
4. 重量建议基于用户上次训练记录渐进递增
5. 增肌目标：大重量动作 5-8 次/组，孤立动作 10-12 次/组
6. 动作名称用中文
7. 只输出 JSON，不要有任何解释文字`;
}

async function generatePlan() {
  const btn = event.target;
  if (!profile.apiKey) { alert('请先在「我的」页面设置 DeepSeek API Key'); return; }
  btn.textContent = 'AI 生成中...';
  btn.disabled = true;
  const prompt = buildAiPrompt();
  const result = await aiCall(prompt);
  if (!result) { btn.textContent = 'AI 调整'; btn.disabled = false; return; }
  // 解析 JSON
  try {
    const jsonStr = result.replace(/```json\s*|\s*```/g, '').trim();
    const newPlan = JSON.parse(jsonStr);
    if (!newPlan.days || !Array.isArray(newPlan.days)) throw new Error('格式错误');
    // 给每个动作加 id
    let eid = 1;
    newPlan.days.forEach((d, di) => {
      d.id = 'ai-' + di;
      d.exercises.forEach(ex => { ex.id = 'ai-e' + (eid++); ex.prevW = null; ex.prevR = null; });
    });
    plan = newPlan;
    LS.set('plan', plan);
    todayIndex = 0;
    LS.set('today_index', 0);
    applyPrevRecords();
    resetTraining();
    selectedDayIdx = 0;
    renderPlanPage();
    renderHomePage();
    btn.textContent = 'AI 调整';
    btn.disabled = false;
  } catch(e) {
    alert('AI 返回格式解析失败，请重试。错误: ' + e.message);
    btn.textContent = 'AI 调整';
    btn.disabled = false;
  }
}
