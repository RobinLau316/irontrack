<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>IronTrack - 智能健身伴侣</title>
<link rel="manifest" href="data:application/json,{}">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a2e;--card:#2d2d44;--border:#3d3d54;--accent:#ff6b35;
  --accent-light:#ff8c42;--text:#e8e8e8;--muted:#999
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{max-width:430px;margin:0 auto;min-height:100vh;padding:16px 16px 100px;position:relative;padding-top:max(16px,env(safe-area-inset-top,16px))}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* 页面容器 */
.page{display:none;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* 底部导航 */
#bottomNav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(29,29,44,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0)}
#bottomNav .nav-inner{display:flex;align-items:center;justify-content:space-around;height:70px;max-width:430px;margin:0 auto}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;cursor:pointer;border:none;background:none;color:var(--muted);font-size:14px;transition:color .2s;position:relative;min-height:44px;justify-content:center}
.nav-item.active{color:var(--accent);font-weight:600}
.nav-item svg{width:24px;height:24px}
.nav-item.primary{margin-top:-28px}
.nav-item.primary .nav-btn-circle{width:56px;height:56px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(255,107,53,.3);transition:transform .2s}
.nav-item.primary:hover .nav-btn-circle{transform:scale(1.08)}
.nav-item.primary svg{width:28px;height:28px}

/* 通用组件 */
.card{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:18px;margin-bottom:14px}
.btn{display:block;width:100%;padding:16px;border-radius:14px;border:none;font-size:18px;font-weight:700;cursor:pointer;text-align:center;transition:opacity .2s;text-decoration:none;min-height:50px}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 0 0 0 rgba(255,107,53,.4);animation:pulse 2s infinite}
.btn-accent:hover{opacity:.9}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,.4)}50%{box-shadow:0 0 0 12px rgba(255,107,53,0)}}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.badge{display:inline-block;padding:6px 14px;border-radius:20px;background:var(--bg);font-size:14px;color:var(--muted);border:1px solid var(--border)}
.tag{display:inline-block;padding:5px 14px;border-radius:20px;background:var(--bg);font-size:14px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-item{background:var(--card);border-radius:14px;padding:14px;text-align:center;border:1px solid var(--border)}
.stat-value{color:var(--accent);font-size:36px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-label{color:var(--muted);font-size:14px;margin-top:4px}
.section-title{font-size:18px;font-weight:700;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between}
.flex-gap{display:flex;gap:10px;flex-wrap:wrap}
.mt-3{margin-top:14px}.mt-4{margin-top:18px}.mb-3{margin-bottom:14px}.mb-4{margin-bottom:18px}
.text-accent{color:var(--accent)}.text-muted{color:var(--muted)}.text-sm{font-size:16px}.text-xs{font-size:14px}
.font-bold{font-weight:700}.text-center{text-align:center}

/* 训练体系页 */
.cycle-chain{display:flex;align-items:flex-start;gap:6px;overflow-x:auto;padding:6px 2px}
.cycle-step{flex:1;min-width:74px;text-align:center;position:relative;padding-top:10px}
.cycle-step::after{content:'';position:absolute;top:16px;left:50%;width:100%;height:2px;background:var(--border)}
.cycle-step:last-child::after{display:none}
.cycle-step .cycle-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:var(--card);margin:0 auto 8px;position:relative;z-index:1}
.cycle-step.done .cycle-dot{background:var(--accent-light);border-color:var(--accent-light)}
.cycle-step.active .cycle-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,107,53,.22)}
.cycle-name{font-size:13px}
.cycle-step.active .cycle-name{color:var(--accent);font-weight:700}
.cycle-focus{font-size:11px;color:var(--muted)}.cycle-step.done .cycle-focus{color:var(--muted)}
.setup-recommend{background:rgba(255,107,53,.08);border:1px solid rgba(255,107,53,.25);color:var(--text);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.5}
.lib-item{padding:11px 0;border-bottom:1px solid var(--border)}
.lib-item:last-child{border-bottom:none}
.prog-list{list-style:none;padding:0;margin:0}
.prog-list li{padding:8px 0 8px 24px;position:relative;font-size:16px;color:var(--text);line-height:1.55}
.prog-list li::before{content:'✓';position:absolute;left:0;color:var(--accent);font-weight:700}

/* 登录页 */
.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;padding-top:max(32px,env(safe-area-inset-top,32px))}
.login-overlay.hidden{display:none}
.login-logo{font-size:48px;margin-bottom:8px}
.login-title{font-size:26px;font-weight:700;margin-bottom:4px}
.login-subtitle{font-size:16px;color:var(--muted);margin-bottom:28px}
.login-input{width:100%;max-width:300px;padding:14px 18px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:18px;text-align:center;outline:none;margin-bottom:16px;min-height:50px}
.login-input:focus{border-color:var(--accent)}
.login-user-list{width:100%;max-width:300px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
.login-user-chip{padding:10px 20px;border-radius:24px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;transition:border-color .2s;min-height:44px;display:flex;align-items:center}
.login-user-chip:hover,.login-user-chip:active{border-color:var(--accent)}
.login-divider{width:100%;max-width:300px;text-align:center;color:var(--muted);font-size:14px;margin-bottom:16px;position:relative}
.login-divider::before,.login-divider::after{content:'';position:absolute;top:50%;width:30%;height:1px;background:var(--border)}
.login-divider::before{left:0}.login-divider::after{right:0}

/* 首页 */
.greeting{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.greeting h1{font-size:28px;font-weight:700}
.greeting .user-badge{font-size:14px;color:var(--accent);margin-bottom:2px}
.avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,107,53,.15);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:16px;font-weight:700}
.today-card{position:relative}
.today-card .card-header{display:flex;justify-content:space-between;margin-bottom:12px}
.exercise-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.today-day-name{font-size:20px;font-weight:700;margin-bottom:4px}
.today-day-focus{font-size:16px;color:var(--muted);margin-bottom:16px}

/* 计划页 */
.day-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.day-tab{flex-shrink:0;padding:10px 18px;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);white-space:nowrap;transition:all .2s;min-height:44px;display:flex;align-items:center}
.day-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.exercise-list>div{padding:14px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.exercise-list>div:last-child{border-bottom:none}
.ex-number{color:var(--accent);font-weight:700;font-size:17px;width:24px;flex-shrink:0}
.ex-info{flex:1;min-width:0}
.ex-name{font-weight:600;font-size:17px}
.ex-target{color:var(--muted);font-size:15px;margin-top:2px}
.ex-prev{color:var(--muted);font-size:14px;text-align:right;flex-shrink:0}

/* 训练页 - 全屏聚焦 */
.training-container{display:flex;flex-direction:column;min-height:calc(100vh - 220px);justify-content:center}
.training-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;font-size:16px}
.exercise-name{font-size:30px;font-weight:700;text-align:center;margin-bottom:6px}
.exercise-target{color:var(--muted);font-size:16px;text-align:center;margin-bottom:36px}
.num-control{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:28px}
.num-btn{width:52px;height:52px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s;user-select:none}
.num-btn:hover,.num-btn:active{border-color:var(--accent)}
.num-display{text-align:center}
.num-display .big{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
.num-display .unit{font-size:17px;color:var(--muted)}
.num-display .small{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.set-indicator{color:var(--muted);font-size:16px;text-align:center;margin-bottom:18px}
.set-history{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
.set-dot{padding:6px 16px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:15px;color:var(--muted)}

/* 休息倒计时 */
.rest-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 220px);text-align:center}
.rest-circle{width:140px;height:140px;border-radius:50%;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.rest-time{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.rest-label{color:var(--muted);font-size:17px;margin-bottom:10px}
.rest-next{color:var(--muted);font-size:16px;margin-bottom:28px}
.skip-btn{padding:10px 24px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:16px;cursor:pointer;min-height:44px}

/* 完成页 */
.complete-container{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:calc(100vh - 220px);justify-content:center}
.complete-icon{font-size:64px;margin-bottom:20px}
.complete-title{font-size:30px;font-weight:700;margin-bottom:6px}
.complete-time{color:var(--muted);font-size:17px;margin-bottom:24px}
.summary-card{width:100%;text-align:left;margin-bottom:24px}

/* 数据页 */
.tab-bar{display:flex;background:var(--card);border-radius:14px;padding:4px;border:1px solid var(--border)}
.tab-btn{flex:1;padding:10px;border-radius:12px;border:none;background:transparent;color:var(--muted);font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;min-height:44px}
.tab-btn.active{background:var(--accent);color:#fff}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:24px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{width:100%;border-radius:4px 4px 0 0;position:relative;overflow:hidden;min-height:4px}
.bar-inner{position:absolute;bottom:0;left:0;right:0;border-radius:4px 4px 0 0;background:var(--accent);opacity:.3}
.bar-inner.fill{opacity:.8;height:70%}
.bar-value{font-size:13px;color:var(--muted)}
.bar-label{font-size:13px;color:var(--muted)}
.progress-bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:5px;transition:width .5s}
.stat-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-item-2{background:var(--bg);border-radius:12px;padding:14px}
.stat-item-2 .val{color:var(--accent);font-size:28px;font-weight:700}
.stat-item-2 .lbl{color:var(--muted);font-size:14px}

/* 档案页 */
.field-group{margin-bottom:16px}
.field-label{color:var(--muted);font-size:14px;margin-bottom:6px;display:block}
.field-value{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:17px;min-height:44px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.knowledge-item{display:flex;align-items:flex-start;gap:14px;padding:16px;cursor:pointer;transition:border-color .2s}
.knowledge-item:hover{border-color:rgba(255,107,53,.3)}
.knowledge-icon{font-size:28px;flex-shrink:0}

/* 用户切换区域 */
.user-section{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);border-radius:14px;border:1px solid var(--border);margin-bottom:14px}
.user-section .user-name{font-size:18px;font-weight:600}
.user-section .user-action{font-size:14px;color:var(--accent);cursor:pointer;padding:8px 14px;border-radius:10px;border:1px solid var(--accent);background:transparent;min-height:44px;display:flex;align-items:center}

/* 器械选择 */
.eq-chip{display:inline-block;padding:10px 18px;border-radius:24px;background:var(--bg);border:1px solid var(--border);color:var(--muted);font-size:15px;cursor:pointer;transition:all .2s;min-height:44px;display:flex;align-items:center}
.eq-chip.eq-on{background:rgba(255,107,53,.15);border-color:var(--accent);color:var(--accent);font-weight:600}

/* API Key 状态 */
.api-status{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:6px 12px;border-radius:20px}
.api-status.set{background:rgba(42,157,143,.15);color:#2a9d8f}
.api-status.unset{background:rgba(244,162,97,.15);color:#f4a261}

/* 训练前设置（内嵌引导） */
.setup-title{font-size:24px;font-weight:700;margin-bottom:4px}
.setup-subtitle{font-size:16px;color:var(--muted);margin-bottom:22px}
.setup-group{margin-bottom:20px}
.setup-label{font-size:15px;color:var(--muted);margin-bottom:10px;display:block}
.setup-recommend{background:rgba(255,107,53,.1);border:1px solid rgba(255,107,53,.3);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:10px;line-height:1.5}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt-chip{padding:14px 10px;border-radius:14px;background:var(--bg);border:2px solid var(--border);color:var(--text);font-size:16px;text-align:center;cursor:pointer;transition:all .2s;min-height:52px;display:flex;align-items:center;justify-content:center}
.opt-chip.sel{border-color:var(--accent);background:rgba(255,107,53,.12);color:var(--accent);font-weight:700}
.opt-chip .opt-emoji{display:block;font-size:22px;margin-bottom:4px}
.opt-chip .opt-text{font-size:15px}

/* 训练页分板块 */
.section-tabs{display:flex;gap:8px;margin-bottom:18px}
.section-tab{flex:1;padding:12px 6px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:15px;font-weight:600;text-align:center;cursor:pointer;transition:all .2s;min-height:46px;display:flex;align-items:center;justify-content:center}
.section-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.section-tab .done-mark{margin-left:4px;color:#2a9d8f}
.guide-list>div{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.guide-list>div:last-child{border-bottom:none}
.guide-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;transition:all .2s;color:transparent}
.guide-check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.guide-info{flex:1;min-width:0}
.guide-name{font-weight:600;font-size:17px}
.guide-note{color:var(--muted);font-size:14px;margin-top:2px}
.nutrition-card{background:linear-gradient(135deg,rgba(255,107,53,.12),rgba(42,157,143,.12));border:1px solid var(--border);border-radius:16px;padding:18px;font-size:16px;line-height:1.7;white-space:pre-line}

/* 响应式 */
@media(min-width:768px){.page{padding:0 20px}}
</style>
</head>
<body>
<!-- 登录遮罩 -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-logo">🏋️</div>
  <div class="login-title">IronTrack</div>
  <div class="login-subtitle">智能健身伴侣</div>
  <div id="existingUsers" style="width:100%;max-width:300px"></div>
  <input class="login-input" id="loginInput" type="text" placeholder="输入你的名字" maxlength="12" autocomplete="off">
  <button class="btn btn-accent" style="max-width:300px" onclick="doLogin()">进入</button>
</div>

<div id="app">
  <!-- 首页 -->
  <div id="page-home" class="page active">
    <div id="homeContent"></div>
  </div>

  <!-- 训练体系页 -->
  <div id="page-plan" class="page">
    <div id="systemContent"></div>
  </div>

  <!-- 训练页 -->
  <div id="page-training" class="page">
    <div id="trainingContent"></div>
  </div>

  <!-- 数据页 -->
  <div id="page-data" class="page">
    <h1 class="section-title" style="font-size:24px;margin-bottom:18px">数据追踪</h1>
    <div class="tab-bar mb-4">
      <button class="tab-btn active" onclick="switchDataTab('weight',this)">体重趋势</button>
      <button class="tab-btn" onclick="switchDataTab('strength',this)">力量增长</button>
      <button class="tab-btn" onclick="switchDataTab('measure',this)">围度变化</button>
    </div>
    <div class="card" id="dataChart"></div>
    <div class="card mt-3">
      <div class="section-title">本周训练统计</div>
      <div class="stat-grid-2" id="weekStats">
        <div class="stat-item-2"><div class="val">0</div><div class="lbl">完成训练</div></div>
        <div class="stat-item-2"><div class="val">0</div><div class="lbl">总组数</div></div>
        <div class="stat-item-2"><div class="val">0</div><div class="lbl">总容量 kg</div></div>
        <div class="stat-item-2"><div class="val">0h</div><div class="lbl">总时长</div></div>
      </div>
    </div>
  </div>

  <!-- 我的页 -->
  <div id="page-profile" class="page">
    <h1 class="section-title" style="font-size:24px;margin-bottom:18px">我的</h1>
    <div id="userSection"></div>
    <div class="tab-bar mb-4">
      <button class="tab-btn active" onclick="switchProfileTab('profile',this)">个人档案</button>
      <button class="tab-btn" onclick="switchProfileTab('knowledge',this)">知识库</button>
    </div>
    <div id="profileContent"></div>
  </div>
</div>

<!-- 底部导航 -->
<nav id="bottomNav">
  <div class="nav-inner">
    <button class="nav-item active" onclick="navigate('home')" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>首页</span>
    </button>
    <button class="nav-item" onclick="navigate('plan')" data-page="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>训练体系</span>
    </button>
    <button class="nav-item primary" onclick="navigate('training')" data-page="training">
      <div class="nav-btn-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="2" width="8" height="8" rx="1"/><rect x="14" y="2" width="8" height="8" rx="1"/><rect x="2" y="14" width="8" height="8" rx="1"/><rect x="14" y="14" width="8" height="8" rx="1"/></svg>
      </div>
      <span style="color:#ff6b35">训练</span>

// ============ 工具函数 ============
function formatDate(d) {
  return (d.getMonth()+1)+'/'+d.getDate();
}

function getTodayStr() {
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');
}

function getWeekStart() {
  const d = new Date();
  d.setDate(d.getDate() - d.getDay() + 1);
  return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');
}

function getWeekSessions() {
  const ws = getWeekStart();
  return sessions.filter(s => s.date >= ws);
}

function getStreak() {
  let streak = 0;
  const sorted = [...sessions].sort((a,b) => b.date.localeCompare(a.date));
  const seen = new Set();
  for (const s of sorted) {
    if (!seen.has(s.date)) {
      seen.add(s.date);
      if (streak === 0) streak = 1;
      else streak++;
    }
  }
  return streak;
}

function applyPrevRecords() {
  plan.days.forEach(day => {
    day.exercises.forEach(ex => {
      const lastSession = [...sessions].reverse().find(s => s.dayName === day.name);
      if (lastSession) {
        const lastEx = lastSession.exercises.find(e => e.name === ex.name);
        if (lastEx && lastEx.sets.length > 0) {
          const lastSet = lastEx.sets[lastEx.sets.length - 1];
          ex.prevW = lastSet.w;
          ex.prevR = lastSet.r;
        }
      }
    });
  });
}

}

function pickFocus(f) { setupSel.focus = f; document.querySelectorAll('#setupFocus .opt-chip').forEach(c=>c.classList.toggle('sel',c.textContent===f)); }

function setEnv(k) { setupSel.env = k; markSel('setupEnv'); }
function markSel(id) {
  document.querySelectorAll('#'+id+' .opt-chip').forEach(c => {
    const txt = c.querySelector('.opt-text') ? c.querySelector('.opt-text').textContent : '';
    const key = c.dataset.k || txt;

    c.classList.toggle('sel', key === selObj);
  });
}

    const f = last.focusArea;
    if (f.indexOf('胸') >= 0 || f.indexOf('肩') >= 0) { focus = '背'; reason = '上次是推日，按「'+cycleName+'」循环建议今天练拉日（背、二头）'; }
    else if (f.indexOf('背') >= 0) { focus = '腿'; reason = '上次是拉日，按「'+cycleName+'」循环建议今天练腿日（腿、腹部）'; }
    else if (f.indexOf('腿') >= 0) { focus = '胸'; reason = '上次是腿日，按「'+cycleName+'」循环建议今天练推日（胸、肩、三头）'; }
    else if (f.indexOf('手臂') >= 0) { focus = '胸'; reason = '上次练了手臂，建议今天练推日（胸、肩）均衡各部位'; }
    else { focus = '胸'; reason = '按「'+cycleName+'」循环建议今天从推日（胸、肩、三头）开始'; }
  }
  return { focus: focus, reason: reason };
}

function buildTodayPrompt() {

      return `${e.name}(${maxW}kg)`;
    }).join('、');
    return `${s.date} ${s.dayName||s.focusArea||''}: ${exSummary}`;
  }).join('\n');

  const envHint = {
    '健身房':'可自由使用杠铃、哑铃、绳索、固定器械等全套设备',
    '家用哑铃':'仅有一副哑铃，可配合长凳做推、拉、蹲、弯举等',
    '家用徒手':'无器械，主要用自重动作（俯卧撑、引体、深蹲、弓步、核心）'
  }[setupSel.env];

  // 当前分化体系的核心动作库，作为 AI 选动作的取向参考
  const coreLib = plan.days.map(d =>
    `${d.name}(${d.focus})主项: ${d.exercises.slice(0,5).map(e=>e.name).join('、')}`
  ).join('\n');

  return `你是一名专业健身教练，为增肌训练者按当天需求生成一次训练课。请结合以下信息，生成包含热身、正式训练、拉伸放松和饮食建议的完整训练方案。

【用户档案】
- 身高: ${profile.height}cm, 体重: ${profile.weight}kg, 体脂率: ${profile.bodyFat}%
- 训练经验: ${profile.experience}, 目标: ${profile.goal}

【分化训练体系（选动作时优先采用其中主项，再按当天状态补足）】
${coreLib}

【今日训练安排】
- 训练部位: ${setupSel.focus}
- 身体状态: ${setupSel.state}
- 可用时间: ${setupSel.time}
- 训练环境: ${setupSel.env}（${envHint}）

【最近训练记录（用于连贯性与平衡各部位训练量）】
${recent || '尚无训练记录'}

【生成要求】
1. 正式训练动作数量为 8-15 个；当可用时间较短时适当减少动作与组数，时间充足时可增多组数与动作。
2. 复合动作（卧推/深蹲/硬拉/推举/划船/引体等）优先靠前。

}`;

async function generateTodayPlan() {
  const prompt = buildTodayPrompt();
  const result = await aiCall(prompt);
  if (!result) return null;
  try {
    const jsonStr = result.replace(/```json\s*|\s*```/g, '').trim();
    const data = JSON.parse(jsonStr);
    if (!data.workout || !Array.isArray(data.workout) || data.workout.length === 0) throw new Error('动作为空');
    let eid = 1;
    data.workout.forEach(ex => { ex.id = 'dyn-' + (eid++); });
    todayPlan = {
      date: getTodayStr(),
      focus: data.focus || setupSel.focus,
      factors: { focus: setupSel.focus, state: setupSel.state, time: setupSel.time, env: setupSel.env },
      warmup: data.warmup || [],
      workout: data.workout,
      stretch: data.stretch || [],
      nutrition: data.nutrition || ''
    };
    LS.set('today_plan', todayPlan);
    initDynamicTraining();
    return todayPlan;
  } catch(e) {
    alert('AI 返回格式解析失败，请重试。错误: ' + e.message);
    return null;
  }
}

function getLastSessionSummary() {
  if (sessions.length === 0) return null;
  const s = sessions[0];
  const totalSets = s.exercises.reduce((sum, ex) => sum + ex.sets.length, 0);
  const totalVol = s.exercises.reduce((sum, ex) => sum + ex.sets.reduce((ss, st) => ss + st.w*st.r, 0), 0);
  const dur = s.duration || 0;
  return {
    dayName: s.dayName,
    date: s.date,
    totalSets: totalSets,
    totalVol: totalVol,
    duration: formatTime(dur)
  };
}

// ============ 训练页（动态四板块：热身/正式/拉伸/饮食）============
let trainState = {};

function resetTraining() {
  if (!currentUser) return;
  todayPlan = null;
  LS.set('today_plan', null);
  trainState = {};
}

function initDynamicTraining() {
  const tp = todayPlan;
  const exercises = tp.workout;
  trainState = {
    day: { name: (tp.focus||'训练')+'训练日', focus: tp.focus||'', exercises: exercises },
    exIdx: 0, set: 1,
    weight: exercises[0] ? exercises[0].weight||0 : 0,
    reps: exercises[0] ? exercises[0].reps||8 : 8,
    records: {}, isResting: false, restTimer: 0, sessionTime: 0, complete: false,
    section: 'warmup',   // warmup | workout | stretch | nutrition
    warmupDone: [], stretchDone: [],
    timerInterval: null, restInterval: null
  };
  startSessionTimer();
}

function startSessionTimer() {
  if (trainState.timerInterval) clearInterval(trainState.timerInterval);
  trainState.timerInterval = setInterval(() => {
    if (!trainState.complete && !trainState.isResting) trainState.sessionTime++;
  }, 1000);
}

function startRestTimer() {
  const ex = trainState.day.exercises[trainState.exIdx];
  trainState.restTimer = ex.rest || 90;
  trainState.isResting = true;
  if (trainState.restInterval) clearInterval(trainState.restInterval);
  trainState.restInterval = setInterval(() => {
    if (trainState.restTimer > 0) {
      trainState.restTimer--;
    } else {
      clearInterval(trainState.restInterval);
      trainState.isResting = false;
      renderTrainingPage();
    }
    if (trainState.isResting) renderRestOverlay();
  }, 1000);
  renderRestOverlay();
}

function renderTrainingPage() {
  if (!currentUser) return;
  if (!todayPlan) { renderTrainingSetup(); return; }
  const s = trainState;
  if (s.complete) { renderComplete(); return; }
  if (s.isResting) { renderRestOverlay(); return; }
  renderTrainingUI();
}

function setSection(sec) {
  if (trainState.complete || trainState.isResting) return;
  trainState.section = sec;
  renderTrainingUI();
}

function renderSectionTabs() {
  const s = trainState;
  const warmupAll = todayPlan.warmup.length > 0 && s.warmupDone.length === todayPlan.warmup.length;

  const tabs = [
    {k:'warmup', label:'热身', done:warmupAll},
    {k:'workout', label:'正式', done:workoutDone},
    {k:'stretch', label:'拉伸', done:stretchAll},
    {k:'nutrition', label:'饮食', done:false}

  return `<div class="section-tabs">${tabs.map(t =>

  container.innerHTML = `
    <div class="training-header">
      <span class="text-accent font-bold">${s.day.name}</span>
      <span class="text-muted text-sm">⏱ ${formatTime(s.sessionTime)}</span>
    </div>
    ${renderSectionTabs()}
    ${body}`;
}

function toggleGuide(which, idx) {
  const list = which === 'warmup' ? trainState.warmupDone : trainState.stretchDone;
  const pos = list.indexOf(idx);
  if (pos >= 0) list.splice(pos, 1);
  else list.push(idx);
  renderTrainingUI();
}

function renderRestOverlay() {
  const s = trainState;
  const ex = s.day.exercises[s.exIdx];
  const container = document.getElementById('trainingContent');
  container.innerHTML = `
    <div class="rest-overlay">
      <div class="rest-label">组间休息</div>
      <div class="rest-circle"><div class="rest-time">${s.restTimer}</div></div>
      <div class="rest-next">下一组：第 ${s.set} 组 · ${ex.name}</div>
      <button class="skip-btn" onclick="skipRest()">跳过休息</button>
    </div>
  `;
}

function renderComplete() {
  const s = trainState;
  const container = document.getElementById('trainingContent');
  let summary = s.day.exercises.map(ex => {
    const recs = s.records[ex.id] || [];
    const vol = recs.reduce((sum,r) => sum + r.w*r.r, 0);
    return vol > 0 ? `<div class="row text-sm"><span>${ex.name}</span><span class="text-accent">${vol}kg 总容量</span></div>` : '';
  }).filter(Boolean).join('');
  if (!summary) summary = '<div class="text-muted text-sm text-center">无记录</div>';
  container.innerHTML = `
    <div class="complete-container">
      <div class="complete-icon">🏆</div>
      <div class="complete-title">${s.day.name} 完成！</div>
      <div class="complete-time">总用时 ${formatTime(s.sessionTime)}</div>
      <div class="card summary-card">${summary}</div>
      <button class="btn btn-accent" onclick="resetTraining();renderTrainingPage()">再练一次</button>
      <button class="btn btn-outline mt-3" onclick="navigate('home')">返回首页</button>
    </div>
  `;
}

function adjustWeight(delta) {
  trainState.weight = Math.max(0, trainState.weight + delta);
  renderWorkoutOnly();
}

function renderWorkoutOnly() {
  const s = trainState;
  const ex = s.day.exercises[s.exIdx];
  const recs = s.records[ex.id] || [];
  const ui = document.getElementById('trainingContent');
  ui.querySelector('.exercise-target').textContent = `目标 ${ex.weight}kg · ${ex.sets}组×${ex.reps}次`;
  ui.querySelector('.num-control .big').textContent = s.weight;
  const small = ui.querySelector('.num-control .small');
  if (small) small.textContent = s.reps;
  ui.querySelector('.set-indicator').textContent = `第 ${s.set} 组 / 共 ${ex.sets} 组 · 动作 ${s.exIdx+1}/${s.day.exercises.length}`;
  const sh = ui.querySelector('.set-history');
  if (sh) sh.innerHTML = recs.length > 0 ? recs.map(r=>`<span class="set-dot">组${r.set}:${r.w}×${r.r}</span>`).join('') : '';
}

// 切换动作（左右滑动）
function switchExercise(dir) {
  const s = trainState;
  if (s.complete || s.isResting || s.section !== 'workout') return;
  const total = s.day.exercises.length;
  let idx = s.exIdx + dir;
  if (idx < 0 || idx >= total) return;
  s.exIdx = idx;
  s.set = 1;
  const next = s.day.exercises[idx];
  s.weight = next.weight;
  s.reps = next.reps;
  renderTrainingUI();
}

function adjustReps(delta) {
  trainState.reps = Math.max(0, trainState.reps + delta);
  renderWorkoutOnly();
}

function completeSet() {
  const s = trainState;
  const ex = s.day.exercises[s.exIdx];
  if (!s.records[ex.id]) s.records[ex.id] = [];
  s.records[ex.id].push({set:s.set, w:s.weight, r:s.reps});
  if (s.set < ex.sets) {
    s.set++;
    startRestTimer();
  } else if (s.exIdx < s.day.exercises.length - 1) {
    s.exIdx++;
    s.set = 1;
    const next = s.day.exercises[s.exIdx];
    s.weight = next.weight;
    s.reps = next.reps;
    s.restTimer = 90;
    s.isResting = true;
    startRestTimer();
  } else {
    s.section = 'stretch';
    renderTrainingPage();
  }
}

function finishTraining() {
  const s = trainState;
  s.complete = true;
  if (s.timerInterval) clearInterval(s.timerInterval);
  saveSession();
  const todayDate = formatDate(new Date());
  if (!bodyRecords.find(r => r.date === todayDate)) {
    bodyRecords.push({ date: todayDate, weight: profile.weight, bodyFat: profile.bodyFat });
    if (bodyRecords.length > 30) bodyRecords.shift();
    LS.set('body_records', bodyRecords);
  }
  renderComplete();
}

function saveSession() {
  const s = trainState;
  const session = {
    date: getTodayStr(),
    dayName: s.day.name,
    focusArea: todayPlan.focus,
    factors: todayPlan.factors,
    duration: s.sessionTime,
    exercises: s.day.exercises.map(ex => {
      const recs = s.records[ex.id] || [];
      return { name: ex.name, sets: recs.map(r => ({ w: r.w, r: r.r })) };
    }).filter(e => e.sets.length > 0)
  };
  sessions.unshift(session);
  if (sessions.length > 200) sessions.length = 200;
  LS.set('sessions', sessions);
  todayIndex = (todayIndex + 1) % plan.days.length;
  LS.set('today_index', todayIndex);
  applyPrevRecords();
  // 今日计划已完成，清空以便明天重新生成
  LS.set('today_plan', null);
  todayPlan = null;
}

function skipRest() {
  if (trainState.restInterval) clearInterval(trainState.restInterval);
  trainState.isResting = false;
  trainState.restTimer = 0;
  renderTrainingPage();
}

function formatTime(s) {
  return Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');
}

function switchDataTab(tab, btn) {

function renderDataChart(tab) {
  if (!currentUser) return;
  const container = document.getElementById('dataChart');
  if (tab === 'weight') {
    if (bodyRecords.length === 0) {
      container.innerHTML = '<div class="text-center text-muted text-sm" style="padding:40px">暂无体重记录<br>完成训练后自动记录</div>';
      return;
    }
    const max = Math.max(...bodyRecords.map(r=>r.weight));
    const min = Math.min(...bodyRecords.map(r=>r.weight));
    const range = (max - min) || 1;
    const display = bodyRecords.slice(-7);
    container.innerHTML = `
      <div class="row mb-3"><div class="font-bold text-sm">体重变化</div><span class="text-muted text-xs">最近${display.length}次</span></div>
      <div class="bar-chart">
        ${display.map(r => {
          const h = ((r.weight-min)/range)*100+20;
          return `<div class="bar-col"><span class="bar-value">${r.weight}</span><div class="bar" style="height:${h}%"><div class="bar-inner fill"></div></div><span class="bar-label">${r.date}</span></div>`;
        }).join('')}
      </div>`;
    if (display.length > 1) {
      const first = display[0].weight;
      const last = display[display.length-1].weight;
      const diff = (last - first).toFixed(1);
      const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
      container.innerHTML += `
      <div class="row mt-3 text-xs text-muted">
        <span>起始 ${first}kg</span>
        <span class="${diff<0?'text-accent':diff>0?'':'text-muted'}" style="color:${diff>0?'#f4a261':'var(--accent)'}">${arrow} ${Math.abs(diff)}kg</span>
        <span>当前 ${last}kg</span>
      </div>`;
    }
  } else if (tab === 'measure') {
    if (!measurements || measurements.length === 0) {
      container.innerHTML = '<div class="text-center text-muted text-sm" style="padding:40px">暂无围度记录<br>在「我的」页面填写围度后自动记录</div>';
      return;
    }
    const fields = [
      { key: 'chest', label: '胸围' },
      { key: 'waist', label: '腰围' },
      { key: 'arm', label: '上臂围' },
      { key: 'thigh', label: '大腿围' }
    ];
    const colors = ['var(--accent)','#f4a261','#2a9d8f','#e76f51'];
    let html = `<div class="row mb-4"><div class="font-bold text-sm">围度变化趋势</div><div class="flex-gap text-xs">${fields.map((f,i)=>`<span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${colors[i]};vertical-align:middle;margin-right:3px"></span>${f.label}</span>`).join('')}</div></div>`;
    fields.forEach((f, i) => {
      const recs = measurements.filter(r => r[f.key] > 0);
      if (recs.length === 0) return;
      const first = recs[0][f.key];
      const last = recs[recs.length-1][f.key];
      const diff = (last - first);
      const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
      html += `<div style="margin-bottom:16px">
        <div class="row text-xs text-muted mb-1"><span>${f.label}</span><span style="color:${colors[i]}">${first} → ${last}cm ${arrow} ${Math.abs(diff).toFixed(1)}</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:100%;background:${colors[i]};opacity:.35"></div></div>
        <div class="text-xs text-muted mt-1" style="font-size:12px">最近记录 ${recs[recs.length-1].date}</div>
      </div>`;
    });
    if (html.indexOf('progress-bar') === -1) {
      container.innerHTML = '<div class="text-center text-muted text-sm" style="padding:40px">暂无围度记录<br>在「我的」页面填写围度后自动记录</div>';
      return;
    }
    container.innerHTML = html;
  } else {
    const allEx = {};
    sessions.forEach(s => {
      s.exercises.forEach(ex => {
        if (ex.sets.length > 0) {
          const maxW = Math.max(...ex.sets.map(st => st.w));
          if (!allEx[ex.name]) allEx[ex.name] = [];
          allEx[ex.name].push({ date: s.date, weight: maxW });
        }
      });
    });
    const topEx = Object.entries(allEx)
      .filter(([,v]) => v.length >= 2)
      .slice(0, 4);
    if (topEx.length === 0) {
      container.innerHTML = '<div class="text-center text-muted text-sm" style="padding:40px">完成2次以上训练后<br>可查看力量增长曲线</div>';
      return;
    }
    const colors = ['var(--accent)','#f4a261','#2a9d8f','#e76f51'];
    container.innerHTML = `
      <div class="row mb-4"><div class="font-bold text-sm">力量增长曲线</div><div class="flex-gap text-xs">${topEx.map(([n],i)=>`<span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${colors[i]};vertical-align:middle;margin-right:3px"></span>${n}</span>`).join('')}</div></div>
      ${topEx.map(([name, records], i) => {
        const first = records[0].weight;
        const last = records[records.length-1].weight;
        const pct = Math.min(100, Math.max(0, Math.round(((last - first) / Math.max(first, 1)) * 100)));
        return `<div style="margin-bottom:16px"><div class="row text-xs text-muted mb-1"><span>${name}</span><span style="color:${colors[i]}">${first} → ${last}kg ${last>=first?'+':''}${(last-first).toFixed(1)}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct>0?30+pct*0.7:10}%;background:${colors[i]}"></div></div></div>`;
      }).join('')}
      <div class="text-center text-xs text-muted mt-4">共 ${sessions.length} 次训练记录</div>`;
  }
  updateWeekStats();
}

function updateWeekStats() {
  const ws = getWeekSessions();
  const totalSets = ws.reduce((s, sess) => s + sess.exercises.reduce((es, ex) => es + ex.sets.length, 0), 0);
  const totalVol = ws.reduce((s, sess) => s + sess.exercises.reduce((es, ex) => es + ex.sets.reduce((ss, st) => ss + st.w*st.r, 0), 0), 0);
  const totalTime = ws.reduce((s, sess) => s + (sess.duration||0), 0);
  const statsEl = document.getElementById('weekStats');
  if (statsEl) {
    const target = Math.max(1, profile.trainingDays);
    const pct = Math.min(100, Math.round(ws.length / target * 100));
    statsEl.innerHTML = `
      <div class="stat-item-2"><div class="val">${ws.length}</div><div class="lbl">完成训练</div></div>
      <div class="stat-item-2"><div class="val">${totalSets}</div><div class="lbl">总组数</div></div>
      <div class="stat-item-2"><div class="val">${totalVol.toLocaleString()}</div><div class="lbl">总容量 kg</div></div>
      <div class="stat-item-2"><div class="val">${(totalTime/3600).toFixed(1)}h</div><div class="lbl">总时长</div></div>
      <div class="stat-item-2" style="grid-column:1/-1;text-align:left">
        <div class="row mb-1"><span class="lbl" style="font-size:14px">本周完成率</span><span class="font-bold text-accent" style="font-size:18px">${pct}%</span></div>
        <div class="progress-bar" style="height:10px"><div class="progress-fill" style="width:${pct}%;background:var(--accent)"></div></div>
        <div class="lbl" style="font-size:12px;margin-top:4px">目标 ${target} 次/周 · 已完成 ${ws.length} 次</div>
      </div>`;
  }
}

  const eqEl = document.getElementById('pf-equipment');
  eqEl.innerHTML = EQUIPMENT_OPTIONS.map(opt => `
    <span data-eq="${opt}" class="eq-chip ${profile.equipment.includes(opt)?'eq-on':''}" onclick="toggleEquipment('${opt}')">${opt}</span>
  `).join('');
}

function saveProfile() {
  profile.height = parseFloat(document.getElementById('pf-height').value) || profile.height;
  profile.weight = parseFloat(document.getElementById('pf-weight').value) || profile.weight;
  profile.bodyFat = parseFloat(document.getElementById('pf-bodyfat').value) || profile.bodyFat;
  profile.trainingDays = parseInt(document.getElementById('pf-days').value) || profile.trainingDays;
  profile.goal = document.getElementById('pf-goal').value;
  profile.experience = document.getElementById('pf-exp').value;

  // 保存围度记录（仅在非空时记录，用于趋势追踪）
  const chest = parseFloat(document.getElementById('pf-chest').value);
  const waist = parseFloat(document.getElementById('pf-waist').value);
  const arm = parseFloat(document.getElementById('pf-arm').value);
  const thigh = parseFloat(document.getElementById('pf-thigh').value);
  if (!isNaN(chest)) profile.chest = chest;
  if (!isNaN(waist)) profile.waist = waist;
  if (!isNaN(arm)) profile.arm = arm;
  if (!isNaN(thigh)) profile.thigh = thigh;
  if (chest > 0 || waist > 0 || arm > 0 || thigh > 0) {
    var now = new Date();
    var rec = { date: now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0')+'-'+now.getDate().toString().padStart(2,'0') };
    if (chest > 0) rec.chest = chest;
    if (waist > 0) rec.waist = waist;
    if (arm > 0) rec.arm = arm;
    if (thigh > 0) rec.thigh = thigh;
    var mrecs = LS.get('measurements', []);
    mrecs.push(rec);
    if (mrecs.length > 200) mrecs = mrecs.slice(-200);
    LS.set('measurements', mrecs);
  }

  LS.set('profile', profile);

  // API Key 保存到全局
  const apiKey = document.getElementById('pf-apiKey').value.trim();
  setGlobalApiKey(apiKey);

  var msg = document.getElementById('saveMsg');
  msg.textContent = '已保存';
  setTimeout(function(){ msg.textContent = ''; }, 2000);
  renderUserSection();
  renderHomePage();
}

async function testApiKey() {
  const key = document.getElementById('pf-apiKey').value.trim();
  if (!key) { document.getElementById('apiTestMsg').innerHTML = '<span style="color:#f4a261">请输入 API Key</span>'; return; }
  document.getElementById('apiTestMsg').innerHTML = '<span style="color:var(--muted)">测试中...</span>';
  try {
    const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'user', content: '回复"OK"' }], max_tokens: 5 })
    });
    if (res.ok) {
      document.getElementById('apiTestMsg').innerHTML = '<span style="color:#2a9d8f">连接成功</span>';
    } else {
      const err = await res.json().catch(() => ({}));
      document.getElementById('apiTestMsg').innerHTML = '<span style="color:#e76f51">连接失败: ' + (err.error?.message || res.status) + '</span>';
    }
  } catch(e) {
    document.getElementById('apiTestMsg').innerHTML = '<span style="color:#e76f51">网络错误: ' + e.message + '</span>';
  }
}

// ============ AI 调用 ============
async function aiCall(prompt) {
  const key = getGlobalApiKey();
  if (!key) { alert('请先在「我的」页面设置 DeepSeek API Key'); return null; }
  try {
    const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'user', content: prompt }], temperature: 0.7, max_tokens: 4000 })
    });
    if (!res.ok) { const err = await res.json().catch(() => ({})); alert('AI 调用失败: ' + (err.error?.message || res.status)); return null; }
    const data = await res.json();
    return data.choices[0].message.content;
  } catch(e) { alert('网络错误: ' + e.message); return null; }
}

// ============ 训练页滑动切换 ============
let touchStartX = 0, touchStartY = 0;
document.getElementById('page-training').addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.getElementById('page-training').addEventListener('touchend', function(e) {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0) switchExercise(1);   // 左滑 -> 下一个动作
    else switchExercise(-1);         // 右滑 -> 上一个动作
  }
}, { passive: true });

renderLogin();
