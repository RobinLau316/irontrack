<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>IronTrack - 智能健身伴侣</title>
<link rel="manifest" href="data:application/json,{}">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a2e;--card:#2d2d44;--border:#3d3d54;--accent:#ff6b35;
  --accent-light:#ff8c42;--text:#e8e8e8;--muted:#999
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{max-width:430px;margin:0 auto;min-height:100vh;padding:16px 16px 100px;position:relative;padding-top:max(16px,env(safe-area-inset-top,16px))}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* 页面容器 */
.page{display:none;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* 底部导航 */
#bottomNav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(29,29,44,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0)}
#bottomNav .nav-inner{display:flex;align-items:center;justify-content:space-around;height:70px;max-width:430px;margin:0 auto}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;cursor:pointer;border:none;background:none;color:var(--muted);font-size:14px;transition:color .2s;position:relative;min-height:44px;justify-content:center}
.nav-item.active{color:var(--accent);font-weight:600}
.nav-item svg{width:24px;height:24px}
.nav-item.primary{margin-top:-28px}
.nav-item.primary .nav-btn-circle{width:56px;height:56px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(255,107,53,.3);transition:transform .2s}
.nav-item.primary:hover .nav-btn-circle{transform:scale(1.08)}
.nav-item.primary svg{width:28px;height:28px}

/* 通用组件 */
.card{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:18px;margin-bottom:14px}
.btn{display:block;width:100%;padding:16px;border-radius:14px;border:none;font-size:18px;font-weight:700;cursor:pointer;text-align:center;transition:opacity .2s;text-decoration:none;min-height:50px}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 0 0 0 rgba(255,107,53,.4);animation:pulse 2s infinite}
.btn-accent:hover{opacity:.9}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,.4)}50%{box-shadow:0 0 0 12px rgba(255,107,53,0)}}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.badge{display:inline-block;padding:6px 14px;border-radius:20px;background:var(--bg);font-size:14px;color:var(--muted);border:1px solid var(--border)}
.tag{display:inline-block;padding:5px 14px;border-radius:20px;background:var(--bg);font-size:14px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-item{background:var(--card);border-radius:14px;padding:14px;text-align:center;border:1px solid var(--border)}
.stat-value{color:var(--accent);font-size:36px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-label{color:var(--muted);font-size:14px;margin-top:4px}
.section-title{font-size:18px;font-weight:700;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between}
.flex-gap{display:flex;gap:10px;flex-wrap:wrap}
.mt-3{margin-top:14px}.mt-4{margin-top:18px}.mb-3{margin-bottom:14px}.mb-4{margin-bottom:18px}
.text-accent{color:var(--accent)}.text-muted{color:var(--muted)}.text-sm{font-size:16px}.text-xs{font-size:14px}
.font-bold{font-weight:700}.text-center{text-align:center}

/* 训练体系页 */
.cycle-chain{display:flex;align-items:flex-start;gap:6px;overflow-x:auto;padding:6px 2px}
.cycle-step{flex:1;min-width:74px;text-align:center;position:relative;padding-top:10px}
.cycle-step::after{content:'';position:absolute;top:16px;left:50%;width:100%;height:2px;background:var(--border)}
.cycle-step:last-child::after{display:none}
.cycle-step .cycle-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:var(--card);margin:0 auto 8px;position:relative;z-index:1}
.cycle-step.done .cycle-dot{background:var(--accent-light);border-color:var(--accent-light)}
.cycle-step.active .cycle-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,107,53,.22)}
.cycle-name{font-size:13px}
.cycle-step.active .cycle-name{color:var(--accent);font-weight:700}
.cycle-focus{font-size:11px;color:var(--muted)}.cycle-step.done .cycle-focus{color:var(--muted)}
.setup-recommend{background:rgba(255,107,53,.08);border:1px solid rgba(255,107,53,.25);color:var(--text);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.5}
.lib-item{padding:11px 0;border-bottom:1px solid var(--border)}
.lib-item:last-child{border-bottom:none}
.prog-list{list-style:none;padding:0;margin:0}
.prog-list li{padding:8px 0 8px 24px;position:relative;font-size:16px;color:var(--text);line-height:1.55}
.prog-list li::before{content:'✓';position:absolute;left:0;color:var(--accent);font-weight:700}

/* 登录页 */
.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;padding-top:max(32px,env(safe-area-inset-top,32px))}
.login-overlay.hidden{display:none}
.login-logo{font-size:48px;margin-bottom:8px}
.login-title{font-size:26px;font-weight:700;margin-bottom:4px}
.login-subtitle{font-size:16px;color:var(--muted);margin-bottom:28px}
.login-input{width:100%;max-width:300px;padding:14px 18px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:18px;text-align:center;outline:none;margin-bottom:16px;min-height:50px}
.login-input:focus{border-color:var(--accent)}
.login-user-list{width:100%;max-width:300px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
.login-user-chip{padding:10px 20px;border-radius:24px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;transition:border-color .2s;min-height:44px;display:flex;align-items:center}
.login-user-chip:hover,.login-user-chip:active{border-color:var(--accent)}
.login-divider{width:100%;max-width:300px;text-align:center;color:var(--muted);font-size:14px;margin-bottom:16px;position:relative}
.login-divider::before,.login-divider::after{content:'';position:absolute;top:50%;width:30%;height:1px;background:var(--border)}
.login-divider::before{left:0}.login-divider::after{right:0}

/* 首页 */
.greeting{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.greeting h1{font-size:28px;font-weight:700}
.greeting .user-badge{font-size:14px;color:var(--accent);margin-bottom:2px}
.avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,107,53,.15);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:16px;font-weight:700}
.today-card{position:relative}
.today-card .card-header{display:flex;justify-content:space-between;margin-bottom:12px}
.exercise-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.today-day-name{font-size:20px;font-weight:700;margin-bottom:4px}
.today-day-focus{font-size:16px;color:var(--muted);margin-bottom:16px}

/* 计划页 */
.day-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.day-tab{flex-shrink:0;padding:10px 18px;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);white-space:nowrap;transition:all .2s;min-height:44px;display:flex;align-items:center}
.day-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.exercise-list>div{padding:14px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.exercise-list>div:last-child{border-bottom:none}
.ex-number{color:var(--accent);font-weight:700;font-size:17px;width:24px;flex-shrink:0}
.ex-info{flex:1;min-width:0}
.ex-name{font-weight:600;font-size:17px}
.ex-target{color:var(--muted);font-size:15px;margin-top:2px}
.ex-prev{color:var(--muted);font-size:14px;text-align:right;flex-shrink:0}

/* 训练页 - 全屏聚焦 */
.training-container{display:flex;flex-direction:column;min-height:calc(100vh - 220px);justify-content:center}
.training-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;font-size:16px}
.exercise-name{font-size:30px;font-weight:700;text-align:center;margin-bottom:6px}
.exercise-target{color:var(--muted);font-size:16px;text-align:center;margin-bottom:36px}
.num-control{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:28px}
.num-btn{width:52px;height:52px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s;user-select:none}
.num-btn:hover,.num-btn:active{border-color:var(--accent)}
.num-display{text-align:center}
.num-display .big{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
.num-display .unit{font-size:17px;color:var(--muted)}
.num-display .small{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.reps-input{width:92px;border:0;border-bottom:1px solid transparent;background:transparent;color:var(--text);font:inherit;text-align:center;outline:none;border-radius:0;padding:0;appearance:textfield;-moz-appearance:textfield}
.reps-input::-webkit-outer-spin-button,.reps-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.reps-input:focus{border-bottom-color:var(--accent)}
.weight-input{width:120px;color:var(--accent)}
.set-indicator{color:var(--muted);font-size:16px;text-align:center;margin-bottom:18px}
.set-history{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
.set-dot{padding:6px 16px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:15px;color:var(--muted)}

/* 休息倒计时 */
.rest-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 220px);text-align:center}
.rest-circle{width:140px;height:140px;border-radius:50%;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.rest-time{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.rest-label{color:var(--muted);font-size:17px;margin-bottom:10px}
.rest-next{color:var(--muted);font-size:16px;margin-bottom:28px}
.skip-btn{padding:10px 24px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:16px;cursor:pointer;min-height:44px}

/* 完成页 */
.complete-container{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:calc(100vh - 220px);justify-content:center}
.complete-icon{font-size:64px;margin-bottom:20px}
.complete-title{font-size:30px;font-weight:700;margin-bottom:6px}
.complete-time{color:var(--muted);font-size:17px;margin-bottom:24px}
.summary-card{width:100%;text-align:left;margin-bottom:24px}

/* 数据页 */
.tab-bar{display:flex;background:var(--card);border-radius:14px;padding:4px;border:1px solid var(--border)}
.tab-btn{flex:1;padding:10px;border-radius:12px;border:none;background:transparent;color:var(--muted);font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;min-height:44px}
.tab-btn.active{background:var(--accent);color:#fff}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:24px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{width:100%;border-radius:4px 4px 0 0;position:relative;overflow:hidden;min-height:4px}
.bar-inner{position:absolute;bottom:0;left:0;right:0;border-radius:4px 4px 0 0;background:var(--accent);opacity:.3}
.bar-inner.fill{opacity:.8;height:70%}
.bar-value{font-size:13px;color:var(--muted)}
.bar-label{font-size:13px;color:var(--muted)}
.progress-bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:5px;transition:width .5s}
.stat-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-item-2{background:var(--bg);border-radius:12px;padding:14px}
.stat-item-2 .val{color:var(--accent);font-size:28px;font-weight:700}
.stat-item-2 .lbl{color:var(--muted);font-size:14px}

/* 档案页 */
.field-group{margin-bottom:16px}
.field-label{color:var(--muted);font-size:14px;margin-bottom:6px;display:block}
.field-value{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:17px;min-height:44px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.knowledge-item{display:flex;align-items:flex-start;gap:14px;padding:16px;cursor:pointer;transition:border-color .2s}
.knowledge-item:hover{border-color:rgba(255,107,53,.3)}
.knowledge-icon{font-size:28px;flex-shrink:0}

/* 用户切换区域 */
.user-section{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);border-radius:14px;border:1px solid var(--border);margin-bottom:14px}
.user-section .user-name{font-size:18px;font-weight:600}
.user-section .user-action{font-size:14px;color:var(--accent);cursor:pointer;padding:8px 14px;border-radius:10px;border:1px solid var(--accent);background:transparent;min-height:44px;display:flex;align-items:center}

/* 器械选择 */
.eq-chip{display:inline-block;padding:10px 18px;border-radius:24px;background:var(--bg);border:1px solid var(--border);color:var(--muted);font-size:15px;cursor:pointer;transition:all .2s;min-height:44px;display:flex;align-items:center}
.eq-chip.eq-on{background:rgba(255,107,53,.15);border-color:var(--accent);color:var(--accent);font-weight:600}

/* API Key 状态 */
.api-status{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:6px 12px;border-radius:20px}
.api-status.set{background:rgba(42,157,143,.15);color:#2a9d8f}
.api-status.unset{background:rgba(244,162,97,.15);color:#f4a261}

/* 训练前设置（内嵌引导） */
.setup-title{font-size:24px;font-weight:700;margin-bottom:4px}
.setup-subtitle{font-size:16px;color:var(--muted);margin-bottom:22px}
.setup-group{margin-bottom:20px}
.setup-label{font-size:15px;color:var(--muted);margin-bottom:10px;display:block}
.setup-recommend{background:rgba(255,107,53,.1);border:1px solid rgba(255,107,53,.3);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:10px;line-height:1.5}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt-chip{padding:14px 10px;border-radius:14px;background:var(--bg);border:2px solid var(--border);color:var(--text);font-size:16px;text-align:center;cursor:pointer;transition:all .2s;min-height:52px;display:flex;align-items:center;justify-content:center}
.opt-chip.sel{border-color:var(--accent);background:rgba(255,107,53,.12);color:var(--accent);font-weight:700}
.opt-chip .opt-emoji{display:block;font-size:22px;margin-bottom:4px}
.opt-chip .opt-text{font-size:15px}

/* 训练页分板块 */
.section-tabs{display:flex;gap:8px;margin-bottom:18px}
.section-tab{flex:1;padding:12px 6px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:15px;font-weight:600;text-align:center;cursor:pointer;transition:all .2s;min-height:46px;display:flex;align-items:center;justify-content:center}
.section-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.section-tab .done-mark{margin-left:4px;color:#2a9d8f}
.guide-list>div{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.guide-list>div:last-child{border-bottom:none}
.guide-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;transition:all .2s;color:transparent}
.guide-check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.guide-info{flex:1;min-width:0}
.guide-name{font-weight:600;font-size:17px}
.guide-note{color:var(--muted);font-size:14px;margin-top:2px}
.nutrition-card{background:linear-gradient(135deg,rgba(255,107,53,.12),rgba(42,157,143,.12));border:1px solid var(--border);border-radius:16px;padding:18px;font-size:16px;line-height:1.7;white-space:pre-line}
.setup-input{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-size:16px;outline:none}
.setup-input:focus{border-color:var(--accent)}
.plan-source{display:inline-flex;padding:5px 10px;border-radius:18px;font-size:13px;background:rgba(42,157,143,.15);color:#2a9d8f}
.plan-source.local{background:rgba(244,162,97,.15);color:#f4a261}
.preview-item{padding:14px 0;border-bottom:1px solid var(--border)}
.preview-item:last-child{border-bottom:none}
.preview-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.preview-role{flex-shrink:0;padding:4px 8px;border-radius:10px;background:rgba(255,107,53,.13);color:var(--accent);font-size:12px}
.preview-role.aux{background:var(--bg);color:var(--muted)}
.preview-actions{display:flex;gap:8px;margin-top:10px}
.mini-btn{min-height:38px;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;cursor:pointer}
.mini-btn.on{border-color:var(--accent);color:var(--accent)}
.edit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.edit-field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.edit-field input{width:100%;min-height:40px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);text-align:center;font-size:15px;outline:none}
.feedback-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.feedback-btn{min-height:52px;border:1px solid var(--border);border-radius:13px;background:var(--card);color:var(--text);font-size:16px;cursor:pointer}
.feedback-btn:active{border-color:var(--accent);color:var(--accent)}
.resume-banner{padding:12px 14px;border-radius:12px;background:rgba(42,157,143,.12);border:1px solid rgba(42,157,143,.3);color:#54c6b8;font-size:14px;margin-bottom:14px}
.history-card{padding:13px 0;border-bottom:1px solid var(--border)}
.history-card:last-child{border-bottom:none}
.reason-note{font-size:13px;color:var(--muted);line-height:1.5;margin-top:5px}
.danger-note{font-size:13px;color:#f4a261;line-height:1.5;margin-top:8px}

/* 响应式 */
@media(min-width:768px){.page{padding:0 20px}}
</style>
</head>
<body>
<!-- 登录遮罩 -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-logo">🏋️</div>
  <div class="login-title">IronTrack</div>
  <div class="login-subtitle">智能健身伴侣</div>
  <div id="existingUsers" style="width:100%;max-width:300px"></div>
  <input class="login-input" id="loginInput" type="text" placeholder="输入你的名字" maxlength="12" autocomplete="off">
  <button class="btn btn-accent" style="max-width:300px" onclick="doLogin()">进入</button>
</div>

<div id="app">
  <!-- 首页 -->
  <div id="page-home" class="page active">
    <div id="homeContent"></div>
  </div>

  <!-- 训练体系页 -->
  <div id="page-plan" class="page">
    <div id="systemContent"></div>
  </div>

  <!-- 训练页 -->
  <div id="page-training" class="page">
    <div id="trainingContent"></div>
  </div>

  <!-- 数据页 -->
  <div id="page-data" class="page">
    <h1 class="section-title" style="font-size:24px;margin-bottom:18px">数据追踪</h1>
    <div class="tab-bar mb-4">

// ============ 全局 API Key（所有用户共享）============
function getGlobalApiKey() {
  try { return localStorage.getItem('irontrack_global_apikey') || ''; }
  catch(e) { return ''; }
}
function setGlobalApiKey(key) {
  try { localStorage.setItem('irontrack_global_apikey', key); }
  catch(e) { console.warn('存储 API Key 失败:', e); }
}

// ============ 用户管理 ============
let currentUser = '';

function getAllUsers() {
  try {
    const raw = localStorage.getItem('irontrack_users');
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function saveAllUsers(users) {
  try { localStorage.setItem('irontrack_users', JSON.stringify(users)); }
  catch(e) { console.warn('存储用户列表失败:', e); }
}

function addUser(name) {
  const users = getAllUsers();
  if (!users.includes(name)) {
    users.push(name);
    saveAllUsers(users);
  }
}

// ============ localStorage 存储引擎（按用户命名空间）============
const LS = {
  get(key, fallback) {
    if (!currentUser) return fallback;
    try { const v = localStorage.getItem('irontrack_'+currentUser+'_'+key); return v ? JSON.parse(v) : fallback; }
    catch(e) { return fallback; }
  },
  set(key, val) {
    if (!currentUser) return;
    try { localStorage.setItem('irontrack_'+currentUser+'_'+key, JSON.stringify(val)); }
    catch(e) { console.warn('存储失败:', e); }
  }
};

// ============ 工具函数 ============
function formatDate(d) {
  return (d.getMonth()+1)+'/'+d.getDate();
}

function getTodayStr() {
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');
}

function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

function focusKeyFromText(value) {
  const text = String(value || '');
  if (text.includes('背') || text.includes('拉')) return 'pull';
  if (text.includes('腿') || text.includes('臀')) return 'legs';
  return 'push';
}

function focusLabelFromKey(key) {
  return key === 'pull' ? '背' : key === 'legs' ? '腿' : '胸';
}

function getWeekStart() {
  const d = new Date();
  const day = d.getDay();
  d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
  return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');
}

function getWeekSessions() {
  const ws = getWeekStart();
  return sessions.filter(s => s.date >= ws);
}

function getStreak() {
  let streak = 0;
  const sorted = [...sessions].sort((a,b) => b.date.localeCompare(a.date));
  const seen = new Set();
  for (const s of sorted) {
    if (!seen.has(s.date)) {
      seen.add(s.date);
      if (streak === 0) streak = 1;
      else streak++;
    }
  }
  return streak;
}

function applyPrevRecords() {
  plan.days.forEach(day => {
    day.exercises.forEach(ex => {
      const lastSession = [...sessions].reverse().find(s => s.dayName === day.name);
      if (lastSession) {
        const lastEx = lastSession.exercises.find(e => e.name === ex.name);
        if (lastEx && lastEx.sets.length > 0) {
          const lastSet = lastEx.sets[lastEx.sets.length - 1];
          ex.prevW = lastSet.w;
          ex.prevR = lastSet.r;
        }
      }
    });
  });
}

function switchPlan(templateKey) {
  const tmpl = PLAN_TEMPLATES[templateKey];
  if (!tmpl) return;
  plan = { name: tmpl.name, cycle: tmpl.cycle, days: JSON.parse(JSON.stringify(tmpl.days)) };
  LS.set('plan', plan);
  profile.planTemplate = templateKey;
  LS.set('profile', profile);
  todayIndex = 0;
  LS.set('today_index', 0);
  applyPrevRecords();
  resetTraining();
  renderPlanPage();
  renderHomePage();
}

function saveSetupDraft() { LS.set('setup_draft', setupSel); }
function pickFocus(f) { setupSel.focus = f; saveSetupDraft(); document.querySelectorAll('#setupFocus .opt-chip').forEach(c=>c.classList.toggle('sel',c.textContent===f)); }
function setState(k) { setupSel.state = k; saveSetupDraft(); markSel('setupState'); }
function setTime(k) { setupSel.time = k; saveSetupDraft(); markSel('setupTime'); }
function setEnv(k) { setupSel.env = k; saveSetupDraft(); markSel('setupEnv'); }
function toggleDiscomfort(k) {
  if (k === '无') setupSel.discomfort = ['无'];
  else {
    setupSel.discomfort = setupSel.discomfort.filter(x => x !== '无');
    setupSel.discomfort = setupSel.discomfort.includes(k) ? setupSel.discomfort.filter(x => x !== k) : setupSel.discomfort.concat(k);
  }
  saveSetupDraft();
  document.querySelectorAll('#setupDiscomfort .opt-chip').forEach(c=>c.classList.toggle('sel',setupSel.discomfort.includes(c.textContent)));
}
function markSel(id) {
  document.querySelectorAll('#'+id+' .opt-chip').forEach(c => {
    const txt = c.querySelector('.opt-text') ? c.querySelector('.opt-text').textContent : '';
    const key = c.dataset.k || txt;
    const selObj = { setupState:setupSel.state, setupTime:setupSel.time, setupEnv:setupSel.env }[id];
    c.classList.toggle('sel', key === selObj);
  });
}

function suggestTodayFocus() {
  // 周期索引只在完成训练时推进，未完成计划不会改变推荐。

  const day = plan.days[idx] || plan.days[0];

  return { focus, day, key, reason:`${prefix}，今天建议 ${day.name}（${day.focus}）` };
}

function targetExerciseCount(time) {
  return { '30分钟':8, '45分钟':10, '60分钟':12, '90分钟':15 }[time] || 10;
}

function allLibraryExercises(key) {
  const lib = EXERCISE_LIBRARY[key] || EXERCISE_LIBRARY.push;
  return lib.core.concat(lib.auxiliary, BODYWEIGHT_LIBRARY[key] || []);
}

function avoidTerms() {
  return String(setupSel.avoid || '').split(/[、,，;；\s]+/).map(x=>x.trim()).filter(Boolean);
}

function isExerciseBlocked(ex) {
  const terms = avoidTerms();
  if (terms.some(t => ex.name.includes(t) || t.includes(ex.name))) return true;
  const pain = setupSel.discomfort || [];
  if (pain.includes('肩') && ['垂直推','肩外展','肩后束'].includes(ex.pattern)) return true;
  if (pain.includes('肘/腕') && ['肘伸','肘屈'].includes(ex.pattern)) return true;
  if (pain.includes('腰背') && ['髋主导'].includes(ex.pattern)) return true;
  if (pain.includes('髋') && ['髋主导','髋外展'].includes(ex.pattern)) return true;
  if (pain.includes('膝') && ['膝主导','单腿膝主导','膝伸'].includes(ex.pattern)) return true;
  if (pain.includes('踝') && ['提踵','单腿膝主导'].includes(ex.pattern)) return true;
  return false;
}

function matchesEnvironment(ex) {
  if (setupSel.env === '家用徒手') return ex.equipment.includes('徒手');
  if (setupSel.env === '家用哑铃') return ex.equipment.some(e => e === '哑铃' || e === '徒手');
  const available = new Set((profile.equipment || []).concat(['徒手','杠铃','哑铃']));
  return ex.equipment.some(e => available.has(e)) || setupSel.env === '健身房';
}

function getLastExerciseRecord(name) {
  for (const session of sessions) {
    const found = (session.exercises || []).find(ex => ex.name === name);
    if (found && found.sets && found.sets.length) return { session, exercise:found };
  }
  return null;
}

function getExerciseHistory(name, limit=3) {
  const history = [];
  for (const session of sessions) {
    const found = (session.exercises || []).find(ex => ex.name === name);
    if (found) history.push(found);
    if (history.length >= limit) break;
  }
  return history;
}

function hadRecentDiscomfort(name) {
  const last = getLastExerciseRecord(name);
  return !!(last && last.exercise.feedback === '不适');
}

function roundLoad(value) {
  if (!Number.isFinite(value) || value <= 0) return 0;
  return Math.max(0, Math.round(value / 2.5) * 2.5);
}

function adaptExercise(base, reason) {
  const ex = JSON.parse(JSON.stringify(base));
  const last = getLastExerciseRecord(ex.name);
  ex.id = 'dyn-' + Math.random().toString(36).slice(2, 9);
  ex.locked = ex.role === '核心' ? coreLocks[ex.name] !== false : false;
  ex.reason = reason || (ex.role === '核心' ? '训练阶段内保持核心动作稳定' : '按本轮 A/B 方案选择');
  if (last) {
    const maxWeight = Math.max(...last.exercise.sets.map(s => Number(s.w) || 0));
    const feedback = last.exercise.feedback || '';
    ex.weight = maxWeight || ex.weight;
    if (feedback === '轻松' && ex.weight > 0) { ex.weight = roundLoad(ex.weight + 2.5); ex.reason += '；上次评价轻松，建议小幅加重'; }
    else if (feedback === '合适') ex.reason += '；上次评价合适，建议保持';
    else if (feedback === '吃力' && ex.weight > 0) { ex.weight = roundLoad(ex.weight * 0.95); ex.reason += '；上次评价吃力，建议适当减量'; }
    else if (feedback === '不适') ex.reason += '；上次记录不适，本次请重点确认';
    ex.previous = { weight:maxWeight, reps:last.exercise.sets[last.exercise.sets.length-1].r, feedback };
  }
  if (ex.role === '核心') {
    const recent = getExerciseHistory(ex.name,3);
    if (recent.length === 3 && recent.every(item=>item.completed===false)) ex.reason += '；连续 3 次未完成目标，建议本次确认是否替换';
    const phaseDays = Math.max(1, Math.floor((Date.now()-new Date(trainingPhase.startedAt||getTodayStr()).getTime())/86400000)+1);
    if (phaseDays >= 28) ex.reason += `；当前训练阶段已进入第 ${Math.ceil(phaseDays/7)} 周，可评估是否继续`;
  }
  if (setupSel.state === '有些疲惫') {
    ex.sets = Math.max(2, ex.sets - 1);
    ex.reason += '；今日有些疲惫，减少一组';
  } else if (setupSel.state === '比较疲劳') {
    ex.sets = Math.max(2, ex.sets - 1);
    ex.weight = roundLoad(ex.weight * 0.9);
    ex.reason += '；今日比较疲劳，降低训练量';
  }
  return ex;
}

function createLocalPlan() {
  const key = focusKeyFromText(setupSel.focus);
  const lib = EXERCISE_LIBRARY[key];
  const count = targetExerciseCount(setupSel.time);
  const variant = cycleVariants[key] || 'A';
  const replacementPool = lib.auxiliary.concat(BODYWEIGHT_LIBRARY[key]||[]);
  const selectedCoreNames = new Set();
  const corePlans = lib.core.slice(0,2).map(original => {
    let chosen = !isExerciseBlocked(original) && matchesEnvironment(original) ? original : replacementPool.find(ex=>ex.pattern===original.pattern&&!isExerciseBlocked(ex)&&matchesEnvironment(ex)&&!selectedCoreNames.has(ex.name));
    if (!chosen) return null;
    selectedCoreNames.add(chosen.name);
    const adapted = adaptExercise(chosen, chosen.name===original.name?'核心动作锁定，保持训练表现可追踪':`因环境或身体限制，以“${chosen.name}”替代核心动作“${original.name}”`);
    adapted.role = '核心';
    adapted.locked = chosen.name===original.name ? adapted.locked : false;
    return adapted;
  }).filter(Boolean);
  const basePool = (setupSel.env === '家用徒手' ? BODYWEIGHT_LIBRARY[key] : lib.auxiliary.concat(BODYWEIGHT_LIBRARY[key]))
    .filter(ex => !isExerciseBlocked(ex) && !hadRecentDiscomfort(ex.name) && matchesEnvironment(ex) && !corePlans.some(c => c.name === ex.name));
  const need = Math.max(0, count - corePlans.length);
  const offset = variant === 'B' ? Math.ceil(need * 0.34) : 0;
  let rotated = basePool.slice(offset).concat(basePool.slice(0, offset));
  let auxiliaries = rotated.slice(0, need).map(ex => adaptExercise(ex, `辅助动作 ${variant} 方案轮换`));
  if (corePlans.length + auxiliaries.length < count) {
    const extras = allLibraryExercises(key).filter(ex => !isExerciseBlocked(ex) && !corePlans.concat(auxiliaries).some(x=>x.name===ex.name));
    auxiliaries = auxiliaries.concat(extras.slice(0, count-corePlans.length-auxiliaries.length).map(ex=>adaptExercise(ex,'器械受限时的同类补充动作')));
  }
  const workout = corePlans.concat(auxiliaries).slice(0, count);
  return {
    id:'plan-'+Date.now(), date:getTodayStr(), status:'preview', source:'local', variant,
    focus:lib.focus, focusKey:key,
    factors:{ focus:setupSel.focus, state:setupSel.state, time:setupSel.time, env:setupSel.env, discomfort:setupSel.discomfort.slice(), avoid:setupSel.avoid },
    warmup:[
      {name:'低强度有氧',note:'快走或单车 3 分钟，逐步提高体温'},
      {name:'关节动态活动',note:'围绕今天训练部位活动 2～3 分钟'},
      {name:'主项递增热身',note:'从轻重量开始，用 2～3 组逐级接近工作重量'}
    ],
    workout,
    stretch:[
      {name:'目标肌群放松',note:'主要训练肌群各保持 30 秒，自然呼吸'},
      {name:'舒缓活动',note:'低强度走动并观察是否有异常不适'}
    ],
    nutrition:`训练后优先补充蛋白质和适量碳水，并根据你的“${profile.goal}”目标控制全天总量。`,
    notice:getGlobalApiKey() ? '' : '未设置 API Key，本次使用本地备用计划。'
  };
}

function buildTodayPrompt(skeleton) {
  const recent = sessions.slice(0, 6).map(s => `${s.date} ${s.dayName||s.focusArea||''}: ${(s.exercises||[]).map(e=>`${e.name}[${e.feedback||'无反馈'}]`).join('、')}`).join('\n');
  const allowed = allLibraryExercises(skeleton.focusKey).filter(ex=>!isExerciseBlocked(ex)).map(ex=>ex.name).join('、');
  return `你是力量训练计划适配助手。程序已经生成训练骨架，你只能在规则范围内调整，不得进行伤病诊断。
用户：${profile.experience}，目标${profile.goal}，器械${(profile.equipment||[]).join('、')}。
当天：${JSON.stringify(skeleton.factors)}。
最近记录：${recent||'无'}。
允许动作：${allowed}。
骨架：${JSON.stringify(skeleton.workout)}。
要求：
1. 正式动作保持 ${skeleton.workout.length} 个，范围必须是 8-15 个。
2. locked=true 的动作名称和动作模式不得改变。
3. 不得使用不适部位、避开动作或允许列表以外的动作。
4. 每个动作必须返回 name、pattern、role、sets、reps、weight、rest、locked、reason。
5. sets/reps/rest 必须是正整数，weight 必须是非负数字；reason 用一句中文说明调整依据。
6. 只输出 JSON：{"warmup":[{"name":"","note":""}],"workout":[],"stretch":[{"name":"","note":""}],"nutrition":""}`;
}

function normalizeAIPlan(raw, skeleton) {
  if (!raw || !Array.isArray(raw.workout) || raw.workout.length < 8 || raw.workout.length > 15) throw new Error('动作数量不合规');
  if (raw.workout.length !== skeleton.workout.length) throw new Error('动作数量与时间规则不一致');
  const allowed = allLibraryExercises(skeleton.focusKey);
  const allowedMap = new Map(allowed.map(ex=>[ex.name,ex]));
  const lockedNames = skeleton.workout.filter(ex=>ex.locked).map(ex=>ex.name);
  const names = raw.workout.map(ex=>String(ex.name||''));
  if (new Set(names).size !== names.length) throw new Error('动作重复');
  if (lockedNames.some(name=>!names.includes(name))) throw new Error('锁定动作被移除');
  const workout = raw.workout.map((item,index) => {
    const base = allowedMap.get(String(item.name||''));
    if (!base || isExerciseBlocked(base)) throw new Error('出现范围外动作');
    const source = skeleton.workout.find(ex=>ex.name===base.name) || adaptExercise(base,'AI 根据当天状态选择');
    const sets = Number(item.sets), reps = Number(item.reps), weight = Number(item.weight), rest = Number(item.rest);
    if (!Number.isInteger(sets)||sets<1||sets>8||!Number.isInteger(reps)||reps<1||reps>100||!Number.isFinite(weight)||weight<0||!Number.isInteger(rest)||rest<30||rest>300) throw new Error('动作数值不合规');
    return Object.assign({}, source, { id:'dyn-ai-'+index, sets, reps, weight, rest, reason:String(item.reason||source.reason), locked:source.locked, role:source.role, pattern:base.pattern });
  });
  return Object.assign({}, skeleton, {
    source:'ai', notice:'AI 已在本地训练规则范围内完成适配。', workout,
    warmup:Array.isArray(raw.warmup)&&raw.warmup.length?raw.warmup:skeleton.warmup,
    stretch:Array.isArray(raw.stretch)&&raw.stretch.length?raw.stretch:skeleton.stretch,
    nutrition:typeof raw.nutrition==='string'&&raw.nutrition.trim()?raw.nutrition:skeleton.nutrition
  });
}

async function generateTodayPlan() {
  const skeleton = createLocalPlan();
  let generated = skeleton;
  if (getGlobalApiKey()) {
    for (let attempt=0; attempt<2; attempt++) {
      const result = await aiCall(buildTodayPrompt(skeleton), true);
      if (!result) continue;
      try {
        const parsed = JSON.parse(result.replace(/```json\s*|\s*```/g,'').trim());
        generated = normalizeAIPlan(parsed, skeleton);
        break;
      } catch(e) {
        generated.notice = `AI 结果校验未通过，已使用本地备用计划（${e.message}）。`;
      }
    }
  }
  todayPlan = generated;
  LS.set('today_plan', todayPlan);
  LS.set('active_training', null);
  return todayPlan;
}

function getLastSessionSummary() {
  if (sessions.length === 0) return null;
  const s = sessions[0];
  const totalSets = s.exercises.reduce((sum, ex) => sum + ex.sets.length, 0);
  const totalVol = s.exercises.reduce((sum, ex) => sum + ex.sets.reduce((ss, st) => ss + st.w*st.r, 0), 0);
  const dur = s.duration || 0;
  return {
    dayName: s.dayName,
    date: s.date,
    totalSets: totalSets,
    totalVol: totalVol,
    duration: formatTime(dur)
  };
}

function updatePreviewField(index,key,value) {
  const ex = todayPlan.workout[index];
  if (!ex) return;
  if (String(value).trim() === '') return;
  const num = Number(value);
  const limits = { sets:[1,8], reps:[1,100], weight:[0,1000], rest:[30,300] }[key];
  if (!Number.isFinite(num) || num < limits[0] || num > limits[1]) { renderPlanPreview(); return; }
  ex[key] = key === 'weight' ? Math.round(num*2)/2 : Math.round(num);
  ex.reason = '用户在计划预览中手动调整';
  LS.set('today_plan', todayPlan);
}

function togglePlanLock(index) {
  const ex = todayPlan.workout[index];
  if (!ex) return;
  ex.locked = !ex.locked;
  if (ex.role === '核心') {
    coreLocks[ex.name] = ex.locked;
    LS.set('core_locks', coreLocks);
  }
  LS.set('today_plan', todayPlan);
  renderPlanPreview();
}

function swapPlanExercise(index) {
  const current = todayPlan.workout[index];
  if (!current || current.locked) return;
  const used = new Set(todayPlan.workout.map(ex=>ex.name));
  const choices = allLibraryExercises(todayPlan.focusKey).filter(ex=>ex.pattern===current.pattern&&!used.has(ex.name)&&!isExerciseBlocked(ex)&&matchesEnvironment(ex));
  if (!choices.length) { alert('当前条件下没有可用的同类替代动作'); return; }
  const replacement = adaptExercise(choices[0], `替代“${current.name}”，保持${current.pattern}训练目的`);
  replacement.role = current.role;
  replacement.locked = false;
  todayPlan.workout[index] = replacement;
  LS.set('today_plan', todayPlan);
  renderPlanPreview();
}

  const exercises = tp.workout;
  trainState = {
    day: { name: (tp.focus||'训练')+'训练日', focus: tp.focus||'', exercises: exercises },
    exIdx: 0, set: 1,
    weight: exercises[0] ? exercises[0].weight||0 : 0,
    reps: exercises[0] ? exercises[0].reps||8 : 8,
    records: {}, feedback:{}, skipped:{}, pendingFeedback:null, isResting: false, restTimer: 0, restEndAt:0, sessionTime: 0, complete: false,
    section: 'warmup',   // warmup | workout | stretch | nutrition
    warmupDone: [], stretchDone: [],
    timerInterval: null, restInterval: null
  };
  persistTrainingState();
  startSessionTimer();
}

function restoreDynamicTraining() {
  const saved = LS.get('active_training', null);
  if (!saved || saved.planId !== todayPlan.id || !saved.state) {
    initDynamicTraining();
    return;
  }
  trainState = saved.state;
  trainState.timerInterval = null;
  trainState.restInterval = null;
  trainState.feedback = trainState.feedback || {};
  trainState.skipped = trainState.skipped || {};
  trainState.pendingFeedback = trainState.pendingFeedback || null;
  if (trainState.isResting && trainState.restEndAt) {
    trainState.restTimer = Math.max(0, Math.ceil((trainState.restEndAt-Date.now())/1000));
    if (trainState.restTimer <= 0) trainState.isResting = false;
  }
  startSessionTimer();
  if (trainState.isResting) resumeRestTimer();
}

function persistTrainingState() {
  if (!currentUser || !todayPlan || todayPlan.status !== 'active' || !trainState.day) return;
  const snapshot = Object.assign({}, trainState, { timerInterval:null, restInterval:null });
  LS.set('active_training', { version:1, planId:todayPlan.id, savedAt:new Date().toISOString(), state:snapshot });
}

function startSessionTimer() {
  if (trainState.timerInterval) clearInterval(trainState.timerInterval);
  trainState.timerInterval = setInterval(() => {
    if (!trainState.complete) {
      trainState.sessionTime++;
      if (trainState.sessionTime % 5 === 0) persistTrainingState();
    }
  }, 1000);
}

function startRestTimer() {
  const ex = trainState.day.exercises[trainState.exIdx];
  trainState.restTimer = ex.rest || 90;
  trainState.isResting = true;
  trainState.restEndAt = Date.now() + trainState.restTimer * 1000;
  persistTrainingState();
  resumeRestTimer();
}

function resumeRestTimer() {
  if (trainState.restInterval) clearInterval(trainState.restInterval);
  trainState.restInterval = setInterval(() => {
    trainState.restTimer = Math.max(0, Math.ceil((trainState.restEndAt-Date.now())/1000));
    if (trainState.restTimer > 0) {
      if (trainState.restTimer % 5 === 0) persistTrainingState();
    } else {
      clearInterval(trainState.restInterval);
      trainState.isResting = false;
      trainState.restEndAt = 0;
      persistTrainingState();
      renderTrainingPage();
    }
    if (trainState.isResting) renderRestOverlay();
  }, 1000);
  renderRestOverlay();
}

function renderTrainingPage() {
  if (!currentUser) return;
  if (!todayPlan) { renderTrainingSetup(); return; }
  if (todayPlan.status === 'preview') { renderPlanPreview(); return; }
  const s = trainState;
  if (s.complete) { renderComplete(); return; }
  if (s.isResting) { renderRestOverlay(); return; }
  if (s.pendingFeedback) { renderFeedbackPrompt(); return; }
  renderTrainingUI();
}

function setSection(sec) {
  if (trainState.complete || trainState.isResting) return;
  trainState.section = sec;
  persistTrainingState();
  renderTrainingUI();
}

function renderSectionTabs() {
  const s = trainState;
  const warmupAll = todayPlan.warmup.length > 0 && s.warmupDone.length === todayPlan.warmup.length;
  const workoutDone = isWorkoutDone();
  const stretchAll = todayPlan.stretch.length > 0 && s.stretchDone.length === todayPlan.stretch.length;
  const tabs = [
    {k:'warmup', label:'热身', done:warmupAll},
    {k:'workout', label:'正式', done:workoutDone},
    {k:'stretch', label:'拉伸', done:stretchAll},
    {k:'nutrition', label:'饮食', done:false}
  ];
  return `<div class="section-tabs">${tabs.map(t =>
    `<div class="section-tab ${s.section===t.k?'active':''}" onclick="setSection('${t.k}')">${t.label}${t.done?'<span class="done-mark">✓</span>':''}</div>`
  ).join('')}</div>`;
}

function isWorkoutDone() {
  return todayPlan.workout.every(ex => (trainState.records[ex.id]||[]).length >= ex.sets || (trainState.skipped||{})[ex.id]);
}

function renderWarmup() {
  const s = trainState;
  const items = todayPlan.warmup;
  if (!items || items.length === 0) {
    return `<div class="card"><div class="text-muted text-sm">今日无需专门热身，直接开始正式训练即可。</div></div>
      <button class="btn btn-accent mt-3" onclick="setSection('workout')">开始正式训练</button>`;
  }
  return `
    <div class="card">
      <div class="section-title">热身（${s.warmupDone.length}/${items.length}）</div>
      <div class="guide-list">
        ${items.map((it,i) => `
          <div>
            <div class="guide-check ${s.warmupDone.includes(i)?'on':''}" onclick="toggleGuide('warmup',${i})">✓</div>
            <div class="guide-info"><div class="guide-name">${escapeHtml(it.name)}</div>${it.note?`<div class="guide-note">${escapeHtml(it.note)}</div>`:''}</div>
          </div>`).join('')}
      </div>
    </div>
    <button class="btn btn-accent mt-3" onclick="setSection('workout')">开始正式训练</button>`;
}

function renderWorkout() {
  const s = trainState;
  const ex = s.day.exercises[s.exIdx];
  s.reps = validReps(s.reps, validReps(ex.reps, 8));
  const recs = s.records[ex.id] || [];
  return `
    <div class="training-container">
      <div class="exercise-name">${ex.name}</div>
      <div class="exercise-target">目标 ${ex.weight}kg · ${ex.sets}组×${ex.reps}次</div>
      <div class="num-control">
        <div class="num-btn" onclick="adjustWeight(-2.5)">−</div>
        <div class="num-display"><input class="big reps-input weight-input" type="text" inputmode="decimal" value="${s.weight}" aria-label="训练重量" onfocus="this.select()" onkeydown="handleWeightKey(event,this)" onblur="commitWeightInput(this)"><div class="unit">kg</div></div>
        <div class="num-btn" onclick="adjustWeight(2.5)">+</div>
      </div>
      <div class="num-control">
        <div class="num-btn" onclick="adjustReps(-1)">−</div>
        <div class="num-display"><input class="small reps-input" type="text" inputmode="numeric" pattern="[0-9]*" value="${s.reps}" aria-label="训练次数" onfocus="this.select()" onkeydown="handleRepsKey(event,this)" onblur="commitRepsInput(this)"><div class="unit">次</div></div>
        <div class="num-btn" onclick="adjustReps(1)">+</div>
      </div>
      <div class="set-indicator">第 ${s.set} 组 / 共 ${ex.sets} 组 · 动作 ${s.exIdx+1}/${s.day.exercises.length}</div>
      <div class="reason-note text-center">${escapeHtml(ex.reason||'按今日计划执行')}</div>
      ${recs.length > 0 ? `<div class="set-history">${recs.map(r=>`<span class="set-dot">组${r.set}:${r.w}×${r.r}</span>`).join('')}</div>` : ''}
    </div>
    <div class="btn btn-accent" onclick="completeSet()">完成本组</div>
    <button class="btn btn-outline mt-3" onclick="skipExercise()">跳过当前动作</button>
    <button class="btn btn-outline mt-3" onclick="setSection('stretch')">跳过剩余，去拉伸</button>`;
}

function renderStretch() {
  const s = trainState;
  const items = todayPlan.stretch;
  if (!items || items.length === 0) {
    return `<div class="card"><div class="text-muted text-sm">今日无专项拉伸，可自行放松。</div></div>
      <button class="btn btn-accent mt-3" onclick="finishTraining()">完成训练</button>`;
  }
  return `
    <div class="card">
      <div class="section-title">拉伸放松（${s.stretchDone.length}/${items.length}）</div>
      <div class="guide-list">
        ${items.map((it,i) => `
          <div>
            <div class="guide-check ${s.stretchDone.includes(i)?'on':''}" onclick="toggleGuide('stretch',${i})">✓</div>
            <div class="guide-info"><div class="guide-name">${escapeHtml(it.name)}</div>${it.note?`<div class="guide-note">${escapeHtml(it.note)}</div>`:''}</div>
          </div>`).join('')}
      </div>
    </div>
    <button class="btn btn-accent mt-3" onclick="finishTraining()">完成训练</button>`;
}

function renderNutrition() {
  const n = todayPlan.nutrition;
  return `
    <div class="card">
      <div class="section-title">今日饮食建议</div>
      <div class="nutrition-card">${escapeHtml(n || 'AI 生成后在此显示今日饮食建议。')}</div>
    </div>
    ${isWorkoutDone() ? `<button class="btn btn-accent mt-3" onclick="finishTraining()">完成训练</button>` : ''}`;
}

function renderTrainingUI() {
  const s = trainState;
  const container = document.getElementById('trainingContent');
  let body = '';
  if (s.section === 'warmup') body = renderWarmup();
  else if (s.section === 'workout') body = renderWorkout();
  else if (s.section === 'stretch') body = renderStretch();
  else body = renderNutrition();
  container.innerHTML = `
    <div class="training-header">
      <span class="text-accent font-bold">${s.day.name}</span>
      <span class="text-muted text-sm">⏱ ${formatTime(s.sessionTime)}</span>
    </div>
    ${renderSectionTabs()}
    ${body}`;
}

function toggleGuide(which, idx) {
  const list = which === 'warmup' ? trainState.warmupDone : trainState.stretchDone;
  const pos = list.indexOf(idx);
  if (pos >= 0) list.splice(pos, 1);
  else list.push(idx);
  persistTrainingState();
  renderTrainingUI();
}

function renderFeedbackPrompt() {
  const s = trainState;
  const ex = s.day.exercises.find(item=>item.id===s.pendingFeedback);
  if (!ex) { s.pendingFeedback = null; renderTrainingPage(); return; }
  document.getElementById('trainingContent').innerHTML = `
    <div class="min-h-feedback" style="min-height:70vh;display:flex;flex-direction:column;justify-content:center">
      <div class="text-center mb-4"><div class="text-accent text-sm font-bold">动作完成</div><div class="exercise-name" style="margin-top:8px">${escapeHtml(ex.name)}</div><div class="text-muted text-sm">这次动作整体感觉如何？</div></div>
      <div class="feedback-grid">
        <button class="feedback-btn" onclick="submitExerciseFeedback('轻松')">🙂 轻松</button>
        <button class="feedback-btn" onclick="submitExerciseFeedback('合适')">👍 合适</button>
        <button class="feedback-btn" onclick="submitExerciseFeedback('吃力')">😮‍💨 吃力</button>
        <button class="feedback-btn" onclick="submitExerciseFeedback('不适')">⚠️ 不适</button>
      </div>
      <input id="feedbackNote" class="setup-input mt-3" placeholder="如有不适，可补充具体部位（选填）">
    </div>`;
}

function submitExerciseFeedback(value) {
  const s = trainState;
  const exId = s.pendingFeedback;
  const note = (document.getElementById('feedbackNote')?.value || '').trim();
  s.feedback[exId] = { value, note, at:new Date().toISOString() };
  s.pendingFeedback = null;
  advanceAfterExercise();
}

function advanceAfterExercise() {
  const s = trainState;
  let nextIdx = s.exIdx + 1;
  while (nextIdx < s.day.exercises.length) {
    const candidate = s.day.exercises[nextIdx];
    if ((s.records[candidate.id]||[]).length < candidate.sets && !(s.skipped||{})[candidate.id]) break;
    nextIdx++;
  }
  if (nextIdx < s.day.exercises.length) {
    s.exIdx = nextIdx;
    const next = s.day.exercises[s.exIdx];
    const completed = (s.records[next.id]||[]).length;
    s.set = Math.min(next.sets, completed + 1);
    s.weight = next.weight;
    s.reps = next.reps;
    persistTrainingState();
    startRestTimer();
  } else {
    s.section = 'stretch';
    persistTrainingState();
    renderTrainingPage();
  }
}

function skipExercise() {
  const s = trainState;
  const ex = s.day.exercises[s.exIdx];
  if (!confirm(`确定跳过“${ex.name}”吗？`)) return;
  s.skipped = s.skipped || {};
  s.skipped[ex.id] = true;
  s.feedback[ex.id] = { value:'跳过', note:'用户主动跳过', at:new Date().toISOString() };
  advanceAfterExercise();
}

function renderRestOverlay() {
  const s = trainState;
  const ex = s.day.exercises[s.exIdx];
  const container = document.getElementById('trainingContent');
  container.innerHTML = `
    <div class="rest-overlay">
      <div class="rest-label">组间休息</div>
      <div class="rest-circle"><div class="rest-time">${s.restTimer}</div></div>
      <div class="rest-next">下一组：第 ${s.set} 组 · ${ex.name}</div>
      <button class="skip-btn" onclick="skipRest()">跳过休息</button>
    </div>
  `;
}

function renderComplete() {
  const s = trainState;
  const container = document.getElementById('trainingContent');
  let summary = s.day.exercises.map(ex => {
    const recs = s.records[ex.id] || [];
    const vol = recs.reduce((sum,r) => sum + r.w*r.r, 0);
    return vol > 0 ? `<div class="row text-sm"><span>${ex.name}</span><span class="text-accent">${vol}kg 总容量</span></div>` : '';
  }).filter(Boolean).join('');
  if (!summary) summary = '<div class="text-muted text-sm text-center">无记录</div>';
  container.innerHTML = `
    <div class="complete-container">
      <div class="complete-icon">🏆</div>
      <div class="complete-title">${s.day.name} 完成！</div>
      <div class="complete-time">总用时 ${formatTime(s.sessionTime)}</div>
      <div class="card summary-card">${summary}</div>
      <button class="btn btn-accent" onclick="resetTraining();renderTrainingPage()">再练一次</button>
      <button class="btn btn-outline mt-3" onclick="navigate('home')">返回首页</button>
    </div>
  `;
}

function adjustWeight(delta) {
  trainState.weight = Math.max(0, validWeight(trainState.weight, 0) + delta);
  persistTrainingState();
  renderWorkoutOnly();
}

function renderWorkoutOnly() {
  const s = trainState;
  const ex = s.day.exercises[s.exIdx];
  s.reps = validReps(s.reps, validReps(ex.reps, 8));
  const recs = s.records[ex.id] || [];
  const ui = document.getElementById('trainingContent');
  ui.querySelector('.exercise-target').textContent = `目标 ${ex.weight}kg · ${ex.sets}组×${ex.reps}次`;
  ui.querySelector('.num-control .big').value = s.weight;
  const small = ui.querySelector('.num-control .small');
  if (small) small.value = s.reps;
  ui.querySelector('.set-indicator').textContent = `第 ${s.set} 组 / 共 ${ex.sets} 组 · 动作 ${s.exIdx+1}/${s.day.exercises.length}`;
  const sh = ui.querySelector('.set-history');
  if (sh) sh.innerHTML = recs.length > 0 ? recs.map(r=>`<span class="set-dot">组${r.set}:${r.w}×${r.r}</span>`).join('') : '';
}

// 切换动作（左右滑动）
function switchExercise(dir) {
  const s = trainState;
  if (s.complete || s.isResting || s.section !== 'workout') return;
  const total = s.day.exercises.length;
  let idx = s.exIdx + dir;
  if (idx < 0 || idx >= total) return;
  s.exIdx = idx;
  const next = s.day.exercises[idx];
  s.set = Math.min(next.sets, (s.records[next.id]||[]).length + 1);
  s.weight = next.weight;
  s.reps = next.reps;
  persistTrainingState();
  renderTrainingUI();
}

function adjustReps(delta) {
  const ex = trainState.day.exercises[trainState.exIdx];
  trainState.reps = Math.max(0, validReps(trainState.reps, validReps(ex.reps, 8)) + delta);
  persistTrainingState();
  renderWorkoutOnly();
}

function validReps(value, fallback) {
  const normalized = typeof value === 'string' ? value.trim() : value;
  if (normalized === '') return fallback;
  const parsed = typeof normalized === 'number' ? normalized : Number(normalized);
  return Number.isInteger(parsed) && parsed >= 0 ? parsed : fallback;
}

function validWeight(value, fallback) {
  const normalized = typeof value === 'string' ? value.trim() : value;
  if (normalized === '') return fallback;
  const parsed = typeof normalized === 'number' ? normalized : Number(normalized);
  return Number.isFinite(parsed) && parsed >= 0 ? Math.round(parsed*2)/2 : fallback;
}

function commitWeightInput(input) {
  const previous = validWeight(trainState.weight, 0);
  trainState.weight = validWeight(input.value, previous);
  input.value = trainState.weight;
  persistTrainingState();
}

function handleWeightKey(event, input) {
  if (event.key === 'Enter') {
    event.preventDefault();
    commitWeightInput(input);
    input.blur();
  } else if (event.key === 'Escape') {
    input.value = validWeight(trainState.weight, 0);
    input.blur();
  }
}

function commitRepsInput(input) {
  const ex = trainState.day.exercises[trainState.exIdx];
  const previous = validReps(trainState.reps, validReps(ex.reps, 8));
  trainState.reps = validReps(input.value, previous);
  input.value = trainState.reps;
  persistTrainingState();
}

function handleRepsKey(event, input) {
  if (event.key === 'Enter') {
    event.preventDefault();
    commitRepsInput(input);
    input.blur();
  } else if (event.key === 'Escape') {
    input.value = validReps(trainState.reps, 8);
    input.blur();
  }
}

function completeSet() {
  const s = trainState;
  const ex = s.day.exercises[s.exIdx];
  s.reps = validReps(s.reps, validReps(ex.reps, 8));
  if (!s.records[ex.id]) s.records[ex.id] = [];
  s.records[ex.id].push({set:s.set, w:s.weight, r:s.reps});
  persistTrainingState();
  if (s.set < ex.sets) {
    s.set++;
    startRestTimer();
  } else {
    s.pendingFeedback = ex.id;
    persistTrainingState();
    renderTrainingPage();
  }
}

function finishTraining() {
  const s = trainState;
  s.complete = true;
  if (s.timerInterval) clearInterval(s.timerInterval);
  saveSession();
  const todayDate = formatDate(new Date());
  if (!bodyRecords.find(r => r.date === todayDate)) {
    bodyRecords.push({ date: todayDate, weight: profile.weight, bodyFat: profile.bodyFat });
    if (bodyRecords.length > 30) bodyRecords.shift();
    LS.set('body_records', bodyRecords);
  }
  renderComplete();
}

function saveSession() {
  const s = trainState;
  const session = {
    date: getTodayStr(),
    dayName: s.day.name,
    focusArea: todayPlan.focus,
    factors: todayPlan.factors,
    source: todayPlan.source,
    variant: todayPlan.variant,
    duration: s.sessionTime,
    exercises: s.day.exercises.map(ex => {
      const recs = s.records[ex.id] || [];
      const feedback = s.feedback[ex.id] || {};
      return { name: ex.name, role:ex.role, pattern:ex.pattern, targetSets:ex.sets, targetReps:ex.reps, completed:recs.length>=ex.sets, skipped:!!(s.skipped||{})[ex.id], feedback:feedback.value||'', feedbackNote:feedback.note||'', sets: recs.map(r => ({ w: r.w, r: r.r })) };
    }).filter(e => e.sets.length > 0 || e.skipped)
  };
  sessions.unshift(session);
  if (sessions.length > 200) sessions.length = 200;
  LS.set('sessions', sessions);
  const key = todayPlan.focusKey || focusKeyFromText(todayPlan.focus);
  const actualIdx = plan.days.findIndex(day => focusKeyFromText(day.focus||day.name) === key);
  todayIndex = actualIdx >= 0 ? (actualIdx + 1) % plan.days.length : (todayIndex + 1) % plan.days.length;
  LS.set('today_index', todayIndex);
  cycleVariants[key] = cycleVariants[key] === 'B' ? 'A' : 'B';
  LS.set('cycle_variants', cycleVariants);
  trainingPhase.completedSessions = (trainingPhase.completedSessions||0) + 1;
  LS.set('training_phase', trainingPhase);
  applyPrevRecords();
  // 今日计划已完成，清空以便明天重新生成
  LS.set('today_plan', null);
  LS.set('active_training', null);
  todayPlan = null;
}

function skipRest() {
  if (trainState.restInterval) clearInterval(trainState.restInterval);
  trainState.isResting = false;
  trainState.restTimer = 0;
  trainState.restEndAt = 0;
  persistTrainingState();
  renderTrainingPage();
}

function formatTime(s) {
  return Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');
}

// ============ 数据页 ============
function switchDataTab(tab, btn) {
  document.querySelectorAll('#page-data .tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderDataChart(tab);
}

function renderDataChart(tab) {
  if (!currentUser) return;
  const container = document.getElementById('dataChart');
  renderSessionHistory();
  updateWeekStats();
  if (tab === 'weight') {
    if (bodyRecords.length === 0) {
      container.innerHTML = '<div class="text-center text-muted text-sm" style="padding:40px">暂无体重记录<br>完成训练后自动记录</div>';
      return;
    }
    const max = Math.max(...bodyRecords.map(r=>r.weight));
    const min = Math.min(...bodyRecords.map(r=>r.weight));
    const range = (max - min) || 1;
    const display = bodyRecords.slice(-7);
    container.innerHTML = `
      <div class="row mb-3"><div class="font-bold text-sm">体重变化</div><span class="text-muted text-xs">最近${display.length}次</span></div>
      <div class="bar-chart">
        ${display.map(r => {
          const h = ((r.weight-min)/range)*100+20;
          return `<div class="bar-col"><span class="bar-value">${r.weight}</span><div class="bar" style="height:${h}%"><div class="bar-inner fill"></div></div><span class="bar-label">${r.date}</span></div>`;
        }).join('')}
      </div>`;
    if (display.length > 1) {
      const first = display[0].weight;
      const last = display[display.length-1].weight;
      const diff = (last - first).toFixed(1);
      const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
      container.innerHTML += `
      <div class="row mt-3 text-xs text-muted">
        <span>起始 ${first}kg</span>
        <span class="${diff<0?'text-accent':diff>0?'':'text-muted'}" style="color:${diff>0?'#f4a261':'var(--accent)'}">${arrow} ${Math.abs(diff)}kg</span>
        <span>当前 ${last}kg</span>
      </div>`;
    }
  } else if (tab === 'measure') {
    if (!measurements || measurements.length === 0) {
      container.innerHTML = '<div class="text-center text-muted text-sm" style="padding:40px">暂无围度记录<br>在「我的」页面填写围度后自动记录</div>';
      return;
    }
    const fields = [
      { key: 'chest', label: '胸围' },
      { key: 'waist', label: '腰围' },
      { key: 'arm', label: '上臂围' },
      { key: 'thigh', label: '大腿围' }
    ];
    const colors = ['var(--accent)','#f4a261','#2a9d8f','#e76f51'];
    let html = `<div class="row mb-4"><div class="font-bold text-sm">围度变化趋势</div><div class="flex-gap text-xs">${fields.map((f,i)=>`<span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${colors[i]};vertical-align:middle;margin-right:3px"></span>${f.label}</span>`).join('')}</div></div>`;
    fields.forEach((f, i) => {
      const recs = measurements.filter(r => r[f.key] > 0);
      if (recs.length === 0) return;
      const first = recs[0][f.key];
      const last = recs[recs.length-1][f.key];
      const diff = (last - first);
      const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
      html += `<div style="margin-bottom:16px">
        <div class="row text-xs text-muted mb-1"><span>${f.label}</span><span style="color:${colors[i]}">${first} → ${last}cm ${arrow} ${Math.abs(diff).toFixed(1)}</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:100%;background:${colors[i]};opacity:.35"></div></div>
        <div class="text-xs text-muted mt-1" style="font-size:12px">最近记录 ${recs[recs.length-1].date}</div>
      </div>`;
    });
    if (html.indexOf('progress-bar') === -1) {
      container.innerHTML = '<div class="text-center text-muted text-sm" style="padding:40px">暂无围度记录<br>在「我的」页面填写围度后自动记录</div>';
      return;
    }
    container.innerHTML = html;
  } else {
    const allEx = {};
    [...sessions].reverse().forEach(s => {
      s.exercises.forEach(ex => {
        if (ex.sets.length > 0) {
          const maxW = Math.max(...ex.sets.map(st => st.w));
          if (!allEx[ex.name]) allEx[ex.name] = [];
          allEx[ex.name].push({ date: s.date, weight: maxW });
        }
      });
    });
    const topEx = Object.entries(allEx)
      .filter(([,v]) => v.length >= 2)
      .slice(0, 4);
    if (topEx.length === 0) {
      container.innerHTML = '<div class="text-center text-muted text-sm" style="padding:40px">完成2次以上训练后<br>可查看力量增长曲线</div>';
      return;
    }
    const colors = ['var(--accent)','#f4a261','#2a9d8f','#e76f51'];
    container.innerHTML = `
      <div class="row mb-4"><div class="font-bold text-sm">力量增长曲线</div><div class="flex-gap text-xs">${topEx.map(([n],i)=>`<span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${colors[i]};vertical-align:middle;margin-right:3px"></span>${n}</span>`).join('')}</div></div>
      ${topEx.map(([name, records], i) => {
        const first = records[0].weight;
        const last = records[records.length-1].weight;
        const pct = Math.min(100, Math.max(0, Math.round(((last - first) / Math.max(first, 1)) * 100)));
        return `<div style="margin-bottom:16px"><div class="row text-xs text-muted mb-1"><span>${name}</span><span style="color:${colors[i]}">${first} → ${last}kg ${last>=first?'+':''}${(last-first).toFixed(1)}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct>0?30+pct*0.7:10}%;background:${colors[i]}"></div></div></div>`;
      }).join('')}
      <div class="text-center text-xs text-muted mt-4">共 ${sessions.length} 次训练记录</div>`;
  }
  updateWeekStats();
}

function renderSessionHistory() {
  const el = document.getElementById('sessionHistory');
  if (!el) return;
  if (!sessions.length) {
    el.innerHTML = '<div class="text-muted text-sm">完成训练后，这里会显示记录和动作反馈。</div>';
    return;
  }
  el.innerHTML = sessions.slice(0,8).map(session => {
    const exercises = session.exercises || [];
    const feedback = exercises.filter(ex=>ex.feedback).map(ex=>`${ex.name}：${ex.feedback}${ex.feedbackNote?'（'+escapeHtml(ex.feedbackNote)+'）':''}`).join(' · ');
    const totalSets = exercises.reduce((sum,ex)=>sum+(ex.sets||[]).length,0);
    const totalVol = exercises.reduce((sum,ex)=>sum+(ex.sets||[]).reduce((s,set)=>s+(Number(set.w)||0)*(Number(set.r)||0),0),0);
    return `<div class="history-card">
      <div class="row"><div class="font-bold text-sm">${escapeHtml(session.dayName||session.focusArea||'训练')}</div><span class="text-muted text-xs">${escapeHtml(session.date)}</span></div>
      <div class="reason-note">${totalSets} 组 · ${Math.round(totalVol).toLocaleString()}kg 总容量 · ${formatTime(session.duration||0)}</div>
      ${feedback?`<div class="reason-note">反馈：${feedback}</div>`:'<div class="reason-note">此记录暂无动作反馈</div>'}
    </div>`;
  }).join('');
}

function updateWeekStats() {
  const ws = getWeekSessions();
  const totalSets = ws.reduce((s, sess) => s + sess.exercises.reduce((es, ex) => es + ex.sets.length, 0), 0);
  const totalVol = ws.reduce((s, sess) => s + sess.exercises.reduce((es, ex) => es + ex.sets.reduce((ss, st) => ss + st.w*st.r, 0), 0), 0);
  const totalTime = ws.reduce((s, sess) => s + (sess.duration||0), 0);
  const statsEl = document.getElementById('weekStats');
  if (statsEl) {
    const target = Math.max(1, profile.trainingDays);
    const pct = Math.min(100, Math.round(ws.length / target * 100));
    statsEl.innerHTML = `
      <div class="stat-item-2"><div class="val">${ws.length}</div><div class="lbl">完成训练</div></div>
      <div class="stat-item-2"><div class="val">${totalSets}</div><div class="lbl">总组数</div></div>
      <div class="stat-item-2"><div class="val">${totalVol.toLocaleString()}</div><div class="lbl">总容量 kg</div></div>
      <div class="stat-item-2"><div class="val">${(totalTime/3600).toFixed(1)}h</div><div class="lbl">总时长</div></div>
      <div class="stat-item-2" style="grid-column:1/-1;text-align:left">
        <div class="row mb-1"><span class="lbl" style="font-size:14px">本周完成率</span><span class="font-bold text-accent" style="font-size:18px">${pct}%</span></div>
        <div class="progress-bar" style="height:10px"><div class="progress-fill" style="width:${pct}%;background:var(--accent)"></div></div>
        <div class="lbl" style="font-size:12px;margin-top:4px">目标 ${target} 次/周 · 已完成 ${ws.length} 次</div>
      </div>`;
  }
}

function toggleEquipment(name) {
  if (!profile.equipment) profile.equipment = [];
  const idx = profile.equipment.indexOf(name);
  if (idx >= 0) profile.equipment.splice(idx, 1);
  else profile.equipment.push(name);
  // 更新 UI 选中态
  const chip = document.querySelector('[data-eq="' + name + '"]');
  if (chip) chip.classList.toggle('eq-on');
}

function addEquipment() {
  const input = document.getElementById('pf-eq-new');
  const name = input.value.trim();
  if (!name) return;
  if (!EQUIPMENT_OPTIONS.includes(name)) EQUIPMENT_OPTIONS.push(name);
  if (!profile.equipment) profile.equipment = [];
  if (!profile.equipment.includes(name)) profile.equipment.push(name);
  input.value = '';
  // 重新渲染器械卡片
  const eqEl = document.getElementById('pf-equipment');
  eqEl.innerHTML = EQUIPMENT_OPTIONS.map(opt => `
    <span data-eq="${opt}" class="eq-chip ${profile.equipment.includes(opt)?'eq-on':''}" onclick="toggleEquipment('${opt}')">${opt}</span>
  `).join('');
}

function saveProfile() {
  profile.height = parseFloat(document.getElementById('pf-height').value) || profile.height;
  profile.weight = parseFloat(document.getElementById('pf-weight').value) || profile.weight;
  profile.bodyFat = parseFloat(document.getElementById('pf-bodyfat').value) || profile.bodyFat;
  profile.trainingDays = parseInt(document.getElementById('pf-days').value) || profile.trainingDays;
  profile.goal = document.getElementById('pf-goal').value;
  profile.experience = document.getElementById('pf-exp').value;

  // 保存围度记录（仅在非空时记录，用于趋势追踪）
  const chest = parseFloat(document.getElementById('pf-chest').value);
  const waist = parseFloat(document.getElementById('pf-waist').value);
  const arm = parseFloat(document.getElementById('pf-arm').value);
  const thigh = parseFloat(document.getElementById('pf-thigh').value);
  if (!isNaN(chest)) profile.chest = chest;
  if (!isNaN(waist)) profile.waist = waist;
  if (!isNaN(arm)) profile.arm = arm;
  if (!isNaN(thigh)) profile.thigh = thigh;
  if (chest > 0 || waist > 0 || arm > 0 || thigh > 0) {
    var now = new Date();
    var rec = { date: now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0')+'-'+now.getDate().toString().padStart(2,'0') };
    if (chest > 0) rec.chest = chest;
    if (waist > 0) rec.waist = waist;
    if (arm > 0) rec.arm = arm;
    if (thigh > 0) rec.thigh = thigh;
    var mrecs = LS.get('measurements', []);
    mrecs.push(rec);
    if (mrecs.length > 200) mrecs = mrecs.slice(-200);
    LS.set('measurements', mrecs);
  }

  LS.set('profile', profile);

  // API Key 保存到全局
  const apiKey = document.getElementById('pf-apiKey').value.trim();
  setGlobalApiKey(apiKey);

  var msg = document.getElementById('saveMsg');
  msg.textContent = '已保存';
  setTimeout(function(){ msg.textContent = ''; }, 2000);
  renderUserSection();
  renderHomePage();
}

async function testApiKey() {
  const key = document.getElementById('pf-apiKey').value.trim();
  if (!key) { document.getElementById('apiTestMsg').innerHTML = '<span style="color:#f4a261">请输入 API Key</span>'; return; }
  document.getElementById('apiTestMsg').innerHTML = '<span style="color:var(--muted)">测试中...</span>';
  try {
    const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'user', content: '回复"OK"' }], max_tokens: 5 })
    });
    if (res.ok) {
      setGlobalApiKey(key);
      document.getElementById('apiTestMsg').innerHTML = '<span style="color:#2a9d8f">连接成功，已保存</span>';
    } else {
      const err = await res.json().catch(() => ({}));
      document.getElementById('apiTestMsg').innerHTML = '<span style="color:#e76f51">连接失败: ' + (err.error?.message || res.status) + '</span>';
    }
  } catch(e) {
    document.getElementById('apiTestMsg').innerHTML = '<span style="color:#e76f51">网络错误: ' + e.message + '</span>';
  }
}

function buildBackupPayload() {
  const data = {};
  USER_DATA_KEYS.forEach(key => { data[key] = LS.get(key, null); });
  return { app:'IronTrack', version:BACKUP_VERSION, user:currentUser, exportedAt:new Date().toISOString(), data };
}

function exportBackup() {
  const payload = buildBackupPayload();
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `irontrack-backup-${getTodayStr()}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  const msg = document.getElementById('backupMsg');
  if (msg) msg.textContent = '备份已导出，API Key 未包含在文件中。';
}

async function importBackupFile(file) {
  const msg = document.getElementById('backupMsg');
  if (!file) return;
  try {
    const payload = JSON.parse(await file.text());
    if (payload.app !== 'IronTrack' || payload.version !== BACKUP_VERSION || !payload.data || typeof payload.data !== 'object') throw new Error('文件格式或版本不支持');
    if (!payload.data.profile || typeof payload.data.profile !== 'object' || !payload.data.plan || typeof payload.data.plan !== 'object' || !Array.isArray(payload.data.sessions)) throw new Error('备份缺少个人档案、训练体系或历史记录');
    const sessionCount = Array.isArray(payload.data.sessions) ? payload.data.sessions.length : 0;
    if (!confirm(`备份时间：${payload.exportedAt||'未知'}\n训练记录：${sessionCount} 条\n\n确认恢复并覆盖当前本地数据吗？`)) return;
    LS.set('pre_import_backup', buildBackupPayload());
    USER_DATA_KEYS.forEach(key => LS.set(key, payload.data[key] == null ? null : payload.data[key]));
    initUserData();
    renderProfilePage();
    const restoredMsg = document.getElementById('backupMsg');
    if (restoredMsg) restoredMsg.textContent = '恢复成功；原数据已保存在导入前快照中。';
  } catch(e) {
    if (msg) msg.textContent = '导入失败：' + e.message + '。当前数据未改变。';
  }
}

// ============ AI 调用 ============
async function aiCall(prompt, silent=false) {
  const key = getGlobalApiKey();
  if (!key) { if (!silent) alert('请先在「我的」页面设置 DeepSeek API Key'); return null; }
  try {
    const controller = new AbortController();
    const timeout = setTimeout(()=>controller.abort(),25000);
    const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'user', content: prompt }], temperature: 0.4, max_tokens: 4000 }), signal:controller.signal
    });
    clearTimeout(timeout);
    if (!res.ok) { const err = await res.json().catch(() => ({})); if (!silent) alert('AI 调用失败: ' + (err.error?.message || res.status)); return null; }
    const data = await res.json();
    return data.choices[0].message.content;
  } catch(e) { if (!silent) alert('网络错误: ' + e.message); return null; }
}

// ============ 训练页滑动切换 ============
let touchStartX = 0, touchStartY = 0;
document.getElementById('page-training').addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('beforeunload', persistTrainingState);
document.getElementById('page-training').addEventListener('touchend', function(e) {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0) switchExercise(1);   // 左滑 -> 下一个动作
    else switchExercise(-1);         // 右滑 -> 上一个动作
  }
}, { passive: true });

// ============ 初始化 ============
// 显示登录页面
renderLogin();
</script>
