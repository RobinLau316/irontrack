<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronTrack">
<meta name="theme-color" content="#0b0b0a">
<title>IronTrack - 智能健身伴侣</title>
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./public/app.css">
</head>
<body>
<!-- 登录遮罩 -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-brand">IRONTRACK</div>
  <div class="login-content">
    <div class="login-kicker">PERSONAL PERFORMANCE</div>
    <div class="login-title">今天，继续向上。</div>
    <div class="login-subtitle">选择本地用户，进入你的训练记录。</div>
    <div id="existingUsers" style="width:100%"></div>
    <input class="login-input" id="loginInput" type="text" placeholder="输入你的名字" maxlength="12" autocomplete="off">
    <button class="btn btn-accent" onclick="doLogin()">进入训练</button>
  </div>
</div>

<div id="app">
  <!-- 首页 -->
  <div id="page-home" class="page active">
    <div id="homeContent"></div>
  </div>

  <!-- 训练体系页 -->
  <div id="page-plan" class="page">
    <div id="systemContent"></div>
  </div>

  <!-- 训练页 -->
  <div id="page-training" class="page">
    <div id="trainingContent"></div>
  </div>

  <!-- 数据页 -->
  <div id="page-data" class="page">
    <h1 class="section-title" style="font-size:24px;margin-bottom:18px">数据追踪</h1>
    <div class="tab-bar mb-4">
      <button class="tab-btn active" onclick="switchDataTab('weight',this)">体重趋势</button>
      <button class="tab-btn" onclick="switchDataTab('strength',this)">力量增长</button>
      <button class="tab-btn" onclick="switchDataTab('measure',this)">围度变化</button>
    </div>
    <div class="card" id="dataChart"></div>
    <div class="card mt-3">
      <div class="section-title">本周训练统计</div>
      <div class="stat-grid-2" id="weekStats">
        <div class="stat-item-2"><div class="val">0</div><div class="lbl">完成训练</div></div>
        <div class="stat-item-2"><div class="val">0</div><div class="lbl">总组数</div></div>
        <div class="stat-item-2"><div class="val">0</div><div class="lbl">总容量 kg</div></div>
        <div class="stat-item-2"><div class="val">0h</div><div class="lbl">总时长</div></div>
      </div>
    </div>
    <div class="card mt-3">
      <div class="section-title">最近训练与反馈</div>
      <div id="sessionHistory"></div>
    </div>
  </div>

  <!-- 我的页 -->
  <div id="page-profile" class="page">
    <h1 class="section-title" style="font-size:24px;margin-bottom:18px">我的</h1>
    <div id="userSection"></div>
    <div id="profileContent"></div>
  </div>
</div>

<!-- 底部导航 -->
<nav id="bottomNav">
  <div class="nav-inner">
    <button class="nav-item active" onclick="navigate('home')" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>首页</span>
    </button>
    <button class="nav-item" onclick="navigate('plan')" data-page="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>训练体系</span>
    </button>
    <button class="nav-item primary" onclick="navigate('training')" data-page="training">
      <div class="nav-btn-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 4v16M17 4v16M4 8h3M4 16h3M17 8h3M17 16h3M7 12h10"/></svg>
      </div>
      <span>训练</span>
    </button>
    <button class="nav-item" onclick="navigate('data')" data-page="data">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>数据</span>
    </button>
    <button class="nav-item" onclick="navigate('profile')" data-page="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>我的</span>
    </button>
  </div>
</nav>

<script src="./public/exercise-engine.js"></script>
<script src="./public/app/core.js"></script>
<script src="./public/app/data.js"></script>
<script src="./public/app/helpers.js"></script>
<script src="./public/app/plan.js"></script>
<script src="./public/app/pages.js"></script>
<script src="./public/app/training.js"></script>
<script src="./public/app/boot.js"></script>
</body>
</html>
